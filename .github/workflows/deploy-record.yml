# Apunta en la pantalla de *Deployments* qué está publicado en cada uno de los cinco sitios,
# DESPUÉS de comprobarlo.
#
# Cloudflare despliega solo al empujar a `main`; GitHub no se entera de nada, así que esa
# pantalla estaba vacía. Lo fácil habría sido apuntar "desplegado" nada más fundir, pero eso es
# exactamente lo que hacía la pantalla que llevaba tres meses mintiendo (GitHub Pages, retirado
# en DD-17). Así que aquí no se afirma nada sin medirlo: `record-deploy.mjs` le pide
# `build.json` a cada sitio y espera hasta VER el commit correcto. Si a los 20 minutos alguno
# no lo sirve, se registra como FALLO y el job se pone rojo. Ver DD-59.
#
# `deployments: write` es el único permiso ancho, y vive solo aquí.
name: deploy-record

on:
  push:
    branches: [main]
  # Rescate: volver a comprobar un commit concreto sin tener que empujar nada.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit a comprobar (por defecto, el último de main)'
        required: false

permissions:
  contents: read
  deployments: write

jobs:
  record:
    runs-on: ubuntu-latest
    # Cloudflare construye las cinco a la vez; 25 acota el job por encima de la espera del script.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Sin `npm ci`: los dos scripts son Node pelado (fetch nativo), así no esperan a una
      # instalación para empezar a mirar los sitios.
      #
      # Primero, el dashboard: los cuatro ajustes de Cloudflare que ningún gate del repo ve
      # (comando de build, output dir, rama de producción, NODE_VERSION). Si uno se desvía, el
      # sitio puede publicarse sin sello y el registro de abajo saldría rojo sin decir por qué.
      # Solo corre si el repo tiene el token; sin él, el paso lo dice y no afirma nada.
      - name: Comprobar la configuración de los 5 proyectos en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Sin secret CLOUDFLARE_API_TOKEN: la configuración de Cloudflare NO se ha comprobado (npm run audit:cf-config en local sí puede)."
            exit 0
          fi
          node scripts/audit-cf-config.mjs
      - name: Registrar los 5 sitios (comprobando que sirven el commit)
        run: node scripts/record-deploy.mjs "${{ inputs.sha || github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
