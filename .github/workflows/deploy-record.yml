# Apunta en la pantalla de *Deployments* qué está publicado en cada uno de los cinco sitios,
# DESPUÉS de comprobarlo.
#
# Cloudflare despliega solo al empujar a `main`; GitHub no se entera de nada, así que esa
# pantalla estaba vacía. Lo fácil habría sido apuntar "desplegado" nada más fundir, pero eso es
# exactamente lo que hacía la pantalla que llevaba tres meses mintiendo (GitHub Pages, retirado
# en DD-17). Así que aquí no se afirma nada sin medirlo: `record-deploy.mjs` le pide
# `build.json` a cada sitio y espera hasta VER el commit correcto. Si a los 35 minutos alguno
# no lo sirve, se registra como FALLO y el job se pone rojo. Ver DD-59 y DD-64.
#
# `deployments: write` es el único permiso ancho, y vive solo aquí.
name: deploy-record

on:
  push:
    branches: [main]
  # Rescate: volver a comprobar un commit concreto sin tener que empujar nada. Si main ya lo ha
  # adelantado, el script lo dice y sale sin registrar: ese commit no llegará a servirse.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit a comprobar (por defecto, el último de main)'
        required: false

# Cloudflare solo construye el ÚLTIMO commit encolado de cada rama: al entrar uno nuevo en main,
# el anterior queda `skipped` y no se sirve nunca. Seguir mirándolo es esperar media hora a algo
# que ya no va a pasar, así que un empujón nuevo cancela la comprobación del anterior. El script
# lo comprueba además por su cuenta, por si el `workflow_dispatch` se lanza a mano (DD-64).
concurrency:
  group: deploy-record-${{ inputs.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

# Dos jobs SIN `needs` entre ellos, a propósito: un rojo de configuración del panel no debe
# llevarse por delante el registro. La primera ejecución con secret (2026-09-10) lo hizo: el
# check murió en 6 s y la pantalla de Deployments se quedó sin escribir. Así cada uno enrojece
# por lo suyo y se lee por separado.
jobs:
  # El dashboard: los cuatro ajustes de Cloudflare que ningún gate del repo ve (comando de
  # build, output dir, rama de producción, NODE_VERSION). Si uno se desvía, el sitio puede
  # publicarse sin sello y el registro saldría rojo sin decir por qué. Solo corre si el repo
  # tiene el token; sin él, el paso lo dice y no afirma nada.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Comprobar la configuración de los 5 proyectos en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Sin secret CLOUDFLARE_API_TOKEN: la configuración de Cloudflare NO se ha comprobado (npm run audit:cf-config en local sí puede)."
            exit 0
          fi
          node scripts/audit-cf-config.mjs

  record:
    runs-on: ubuntu-latest
    # Cloudflare construye de una en una en toda la cuenta (medido: concurrencia 1 sobre 87
    # builds), y la cola manda sobre el build. 40 acota el job por encima de la espera del script.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Sin `npm ci`: el script es Node pelado (fetch nativo), así no espera a una instalación
      # para empezar a mirar los sitios.
      - name: Registrar los 5 sitios (comprobando que sirven el commit)
        run: node scripts/record-deploy.mjs "${{ inputs.sha || github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
