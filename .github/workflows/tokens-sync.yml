# Loop diseñador → código (rediseño ROBUSTO). El plugin primeui-figma-plugin-v4
# (Theme Designer) empuja el export DTCG a la rama `design-tokens-sync`.
#
# Clave del rediseño: el robot NO trabaja sobre esa rama (que el plugin también escribe
# y que puede quedar vieja respecto a main). En su lugar:
#   1. parte de MAIN,
#   2. toma SOLO el `kit-export-dtcg.json` que empujó el plugin (ignora su .theme-designer/),
#   3. regenera primitivos + verifica + e2e,
#   4. resetea `design-tokens-sync` a "main + el cambio" (limpio) y abre/actualiza el PR.
#
# Así el PR es SIEMPRE `main + el cambio de tokens` (sin staleness, sin basura del plugin,
# sin carrera de push), y la rama se auto-cura en cada corrida.
#
# La portada del PR la escribe el robot en cada pasada (2026-09-14): veredicto en llano
# (`scripts/tokens-sync-rojo.mjs`), qué cambia (`scripts/tokens-sync-cambios.mjs`), enlaces de
# preview y los SHA. Y deja el check `tokens-sync` en el commit que verificó.
name: tokens-sync

# SIN filtro `paths`, y no es un olvido (2026-09-11, DD-68): el plugin empuja a veces SOLO su
# `.theme-designer/` (commit «Update theme from Figma - 9/11/2026») sin tocar el export. Con el
# filtro, ese push no disparaba nada, la rama se quedaba SIN resetear y, como `ci.yml` exime a
# `design-tokens-sync` confiando en este workflow, el PR #104 llegó a `main` con 172 ficheros del
# plugin y sin que ningún check lo mirase. Ahora CUALQUIER push a la rama la normaliza: el paso
# de reset ya sabe qué hacer cuando el export coincide con main (la deja limpia y cierra el PR).
on:
  push:
    branches: [design-tokens-sync]

permissions:
  contents: write
  pull-requests: write
  # El check `tokens-sync` se escribe en el commit que deja el robot: sus pushes con
  # GITHUB_TOKEN no disparan workflows, así que sin esto el PR no enseña ningún check suyo.
  statuses: write

concurrency:
  group: tokens-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # El Supervisor de MAIN, antes de tocar nada: es el «antes» de las capturas. Se construye en
      # este mismo runner porque los píxeles no cruzan de máquina. Si falla, el PR sale sin capturas,
      # pero el veredicto no cambia.
      - name: Supervisor de main, para las capturas de antes
        id: antes
        continue-on-error: true
        run: |
          npm run build
          npx ng build supervisor --configuration production --output-path "$RUNNER_TEMP/sup-antes"

      # Trae SOLO el export que empujó el plugin, aplicado encima de main (descarta su
      # .theme-designer/ y cualquier divergencia de la rama del plugin).
      - name: Tomar el export del plugin sobre main
        run: |
          git fetch origin design-tokens-sync
          git checkout origin/design-tokens-sync -- projects/design-tokens/scripts/kit-export-dtcg.json

      # El export del plugin (`.theme-designer/`) para el equipo externo, si este push lo trae (DD-88).
      # Es lo que cubre la licencia del plugin: se comprueba y se publica en la rama `tema-zip` junto al
      # tema de nuestras apps. Nunca pone rojo al robot: si un token pasa a 0, no se publica y se avisa.
      - name: Export del plugin para el equipo externo (si este push lo trae)
        id: tema-plugin
        continue-on-error: true
        run: |
          if [ -z "$(git ls-tree -d origin/design-tokens-sync .theme-designer/ts)" ]; then
            echo "Este push no trae el tema del plugin." ; exit 0
          fi
          mkdir -p "$RUNNER_TEMP/plugin" "$RUNNER_TEMP/plugin-anterior"
          git archive origin/design-tokens-sync .theme-designer | tar -x -C "$RUNNER_TEMP/plugin"
          PUB="$RUNNER_TEMP/pub-plugin"
          if git fetch -q origin tema-zip 2>/dev/null; then
            git worktree add -q --detach "$PUB" FETCH_HEAD
          else
            git worktree add -q --detach "$PUB" && git -C "$PUB" checkout -q --orphan tema && git -C "$PUB" rm -rfq --ignore-unmatch .
          fi
          if [ -f "$PUB/tema-plugin.zip" ]; then unzip -q "$PUB/tema-plugin.zip" -d "$RUNNER_TEMP/plugin-anterior"; fi
          SC_PLUGIN_SHA=$(git rev-parse --short origin/design-tokens-sync) \
            node scripts/tema-plugin-zip.mjs "$RUNNER_TEMP/plugin/.theme-designer" "$RUNNER_TEMP/tema-plugin" --anterior "$RUNNER_TEMP/plugin-anterior" \
            | tee "$RUNNER_TEMP/tema-plugin.log"
          rm -f "$PUB/tema-plugin.zip"
          (cd "$RUNNER_TEMP/tema-plugin" && zip -qr "$PUB/tema-plugin.zip" .)
          cp "$RUNNER_TEMP/tema-plugin/LEEME.md" "$PUB/LEEME-plugin.md"
          cp "$RUNNER_TEMP/tema-plugin/manifiesto.json" "$PUB/manifiesto-plugin.json"
          git -C "$PUB" config user.name "github-actions[bot]"
          git -C "$PUB" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUB" add -A
          git -C "$PUB" commit -qm "Export del plugin $(git rev-parse --short origin/design-tokens-sync) [skip ci]"
          for intento in 1 2 3; do
            git -C "$PUB" push -q origin HEAD:refs/heads/tema-zip && break
            git -C "$PUB" pull -q --rebase origin tema-zip
          done
          printf '### Export del plugin para el equipo externo\n\nPublicado en la rama `tema-zip` (`tema-plugin.zip`). %s\n' "$(tail -1 "$RUNNER_TEMP/tema-plugin.log" | sed 's#^✓ export del plugin en [^ ]* · ##')" > "$RUNNER_TEMP/tema-plugin.md"

      # Cada paso guarda su log y NO corta el job: el veredicto se decide al final y el PR dice
      # en llano qué cayó. El run sigue saliendo rojo si algo falló (último paso).
      - name: Regenerar primitivos desde el export
        id: import
        continue-on-error: true
        run: npm run tokens:import 2>&1 | tee "$RUNNER_TEMP/import.log"

      # Un token que tenía medida y pasa a 0 deja la pieza sin esa medida, y ni el import ni
      # los tests de métrica lo cazan (leen el 0 del export y el componente pinta 0). Se para aquí.
      - name: Ningún token del Kit pasa a 0
        id: ceros
        if: steps.import.outcome == 'success'
        continue-on-error: true
        run: node scripts/tokens-sync-cambios.mjs --base origin/main --ceros 2>&1 | tee "$RUNNER_TEMP/ceros.log"

      - name: Verify (parity + guard + escala + build + lint + typecheck)
        id: verify
        if: steps.import.outcome == 'success'
        continue-on-error: true
        run: npm run verify 2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: e2e smoke (regresión visual por cambio de token)
        id: e2e
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        # Lo mismo que el job `e2e-smoke` de ci.yml, y por lo mismo: las baselines de
        # `components.spec.ts` son `*-darwin.png` y este runner es Ubuntu, así que sin esta
        # variable falla SIEMPRE («A snapshot doesn't exist»), traiga el export lo que traiga.
        # Pasó el 2026-09-13 con un export idéntico a main. La red de aquí son las métricas del
        # Kit, que sí corren en Linux; lo vigila `workflow-visual-baselines.test.mjs`.
        env:
          SC_SKIP_VISUAL_BASELINES: '1'
        run: |
          # El repo APT de Chrome del runner a veces viene desincronizado y tumba el
          # `apt-get update` de `--with-deps` antes de bajar nada (ci.yml, 2026-09-09).
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          npx playwright install --with-deps chromium
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      # Si lo ÚNICO que cae son las referencias de estructura y estilos, es que el export cambió
      # medidas a propósito: el robot las regenera, vuelve a pasar la smoke entera y las sube en
      # el mismo commit. Cualquier otro fallo (una medida del Kit que el tema no aplica, un
      # contraste) sigue rojo. Nació del PR #144 (2026-09-13): 2 de sus 14 rojos eran esto, y
      # otros 11 eran tests con la medida del Kit escrita a mano (ahora la leen del export,
      # `e2e/kit-metrics.ts`).
      - name: Actualizar referencias de estructura y estilos, si es lo único que cae
        id: referencias
        if: steps.e2e.outcome == 'failure'
        continue-on-error: true
        env:
          SC_SKIP_VISUAL_BASELINES: '1'
        run: |
          node scripts/tokens-sync-rojo.mjs --e2e "$RUNNER_TEMP/e2e.log" --solo-referencias
          SC_UPDATE_STRUCTURE=1 SC_UPDATE_STYLES=1 npx playwright test component-structure component-styles
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      # Las mismas 8 pantallas del Supervisor en main y con el export, claro y oscuro, a 1440 y con la
      # hora congelada (control antes-contra-antes: 0 de 16 cambian). Solo informa: no pone rojo.
      - name: Capturas de antes y después
        id: capturas
        if: steps.antes.outcome == 'success' && steps.verify.outcome == 'success'
        continue-on-error: true
        run: |
          npx ng build supervisor --configuration production --output-path "$RUNNER_TEMP/sup-despues"
          node scripts/spa-server.mjs "$RUNNER_TEMP/sup-antes/browser" 4801 &
          node scripts/spa-server.mjs "$RUNNER_TEMP/sup-despues/browser" 4802 &
          sleep 3
          SC_ANTES_URL=http://127.0.0.1:4801 SC_DESPUES_URL=http://127.0.0.1:4802 SC_CAPTURAS_OUT="$RUNNER_TEMP/capturas" \
            npx playwright test -c playwright.capturas.config.ts

      # Aunque verify/e2e fallen (drift en capas curadas), publicamos la rama limpia + PR
      # como banco de trabajo; el veredicto va en la portada y en el check `tokens-sync`.
      - name: Resetear design-tokens-sync a main + el cambio, y abrir/actualizar PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMPORT: ${{ steps.import.outcome }}
          CEROS: ${{ steps.ceros.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          REFERENCIAS: ${{ steps.referencias.outcome }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Procedencia: el sha del plugin que este run consumió (ANTES del force-push que lo borra)
          # y, más abajo, el sha que el robot deja. Van en la portada del PR para que no se pueda
          # fundir a ciegas: el #104 entró con 172 ficheros del plugin sin que nadie lo viera (DD-68).
          PLUGIN_SHA=$(git rev-parse origin/design-tokens-sync)

          # Qué cayó. Verde = importa, verifica y la smoke pasa (a la primera o tras actualizar
          # las referencias).
          FALLOS=""
          if [ "$IMPORT" != "success" ]; then FALLOS="import"
          else
            [ "$CEROS" = "success" ] || FALLOS="ceros"
            if [ "$VERIFY" != "success" ]; then FALLOS="${FALLOS:+$FALLOS,}verify"
            elif [ "$E2E" != "success" ] && [ "$REFERENCIAS" != "success" ]; then FALLOS="${FALLOS:+$FALLOS,}e2e"
            fi
          fi
          node scripts/tokens-sync-rojo.mjs --import "$RUNNER_TEMP/import.log" --ceros "$RUNNER_TEMP/ceros.log" --verify "$RUNNER_TEMP/verify.log" --e2e "$RUNNER_TEMP/e2e.log" --failed "$FALLOS" --md "$RUNNER_TEMP/veredicto.md" \
            || printf '### Veredicto\n\n_No se pudo escribir el veredicto: mira el run._\n' > "$RUNNER_TEMP/veredicto.md"
          node scripts/tokens-sync-cambios.mjs --base origin/main --md "$RUNNER_TEMP/cambios.md" \
            || printf '### Qué cambia\n\n_No se pudo calcular: mira el run._\n' > "$RUNNER_TEMP/cambios.md"

          # Solo los ficheros de token y, si el robot las actualizó, las referencias de e2e
          # (NO test-results/ de Playwright, NO .theme-designer/ del plugin).
          git add projects/design-tokens/ e2e/baselines/
          if git diff --cached --quiet; then
            CHANGED=0
            echo "Export == main: la rama se resetea a main limpio (sin residuo del plugin ni de tests)."
          else
            CHANGED=1
            git commit -m "chore(tokens): export del Theme Designer + primitivos regenerados"
          fi
          # El workflow es el ÚNICO dueño de design-tokens-sync: SIEMPRE la reseteamos al estado
          # canónico (main, o main+cambio). Así nunca queda CSS viejo ni basura del plugin aunque
          # el cambio iguale a main (p.ej. un revert).
          #
          # OJO — NADA de [skip ci] en este commit (trampa cazada 2026-06-16):
          #   · El bucle YA está evitado: GitHub no re-dispara workflows por pushes de GITHUB_TOKEN.
          #   · Pero Cloudflare Pages TAMBIÉN obedece [skip ci] → se saltaría el build y el preview
          #     de la rama quedaría CONGELADO (prod mostraba el cambio, el preview de rama no).
          #   El preview de rama es justo lo que el diseñador mira → no se puede saltar su build.
          git push --force origin HEAD:design-tokens-sync

          if [ "$CHANGED" = 0 ]; then
            # Revert / no-op: no hay nada que revisar → cierra el PR si quedó abierto.
            gh pr close design-tokens-sync --comment "Revertido: el export coincide con main; no hay cambio que mergear." 2>/dev/null \
              && echo "PR cerrado (sin cambio)." || echo "Sin PR que cerrar."
          else
            ROBOT_SHA=$(git rev-parse HEAD)
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            # Capturas: se comparan y SOLO las que cambian se publican en la rama `tokens-sync-capturas`
            # (una carpeta por run). `[skip ci]` a propósito AQUÍ: Cloudflare no debe construir esa rama.
            printf '### Cómo se ve\n\n_Sin capturas en esta pasada: mira el run._\n' > "$RUNNER_TEMP/capturas.md"
            if [ "${{ steps.capturas.outcome }}" = "success" ]; then
              URL_BASE="https://raw.githubusercontent.com/${{ github.repository }}/tokens-sync-capturas/${{ github.run_id }}"
              node scripts/tokens-sync-capturas.mjs --dir "$RUNNER_TEMP/capturas" --url-base "$URL_BASE" --md "$RUNNER_TEMP/capturas.md" || true
              PUB="$RUNNER_TEMP/pub"
              if git fetch -q origin tokens-sync-capturas 2>/dev/null; then
                git worktree add -q --detach "$PUB" FETCH_HEAD
              else
                git worktree add -q --detach "$PUB" && git -C "$PUB" checkout -q --orphan capturas && git -C "$PUB" rm -rfq --ignore-unmatch .
              fi
              mkdir -p "$PUB/${{ github.run_id }}"
              node -e 'const r=require(process.argv[1]); for (const x of r.filter((x)=>x.distintos>0)) console.log(x.antes+"\n"+x.despues)' "$RUNNER_TEMP/capturas/resumen.json" \
                | while read -r f; do cp "$RUNNER_TEMP/capturas/$f" "$PUB/${{ github.run_id }}/"; done
              if [ -n "$(ls -A "$PUB/${{ github.run_id }}")" ]; then
                git -C "$PUB" add -A && git -C "$PUB" commit -qm "Capturas del run ${{ github.run_id }} [skip ci]" \
                  && git -C "$PUB" push -q origin HEAD:refs/heads/tokens-sync-capturas \
                  || echo "::warning title=Capturas no publicadas::el PR sale con enlaces rotos a las imágenes."
              fi
            fi
            {
              printf 'Export del Theme Designer aplicado sobre `main`, con los tokens regenerados. El robot reescribe esta portada en cada pasada.\n\n'
              cat "$RUNNER_TEMP/veredicto.md"
              printf '\n\n'
              cat "$RUNNER_TEMP/cambios.md"
              printf '\n\n'
              cat "$RUNNER_TEMP/capturas.md"
              if [ -f "$RUNNER_TEMP/tema-plugin.md" ]; then printf '\n\n'; cat "$RUNNER_TEMP/tema-plugin.md"; fi
              printf '\n\n### Míralo\n\n- Supervisor con este export: https://design-tokens-sync.sc-supervisor.pages.dev\n- sc-docs con este export: https://design-tokens-sync.sc-doc.pages.dev\n\n<sub>Cloudflare los construye unos minutos después del push del robot.</sub>\n'
              printf '\n### Lo que verificó el robot\n\n| | sha |\n| --- | --- |\n| Export del plugin que consumió | `%s` |\n| Commit que dejó en la rama | `%s` |\n\nRun: %s\n\nEl check **tokens-sync** de este PR va en ese commit. Si el plugin vuelve a empujar, el commit nuevo sale sin ese check hasta que el robot lo pase: no fundas un PR sin él.\n' "$PLUGIN_SHA" "$ROBOT_SHA" "$RUN_URL"
            } > "$RUNNER_TEMP/body.md"
            if [ -z "$FALLOS" ]; then
              STATE=success; DESC="Verificado: tokens, verify y e2e en verde"
            else
              STATE=failure; DESC="Rojo en $FALLOS: el porqué, en la portada del PR"
            fi
            gh api "repos/${{ github.repository }}/statuses/$ROBOT_SHA" -f state="$STATE" -f context="tokens-sync" -f description="$DESC" -f target_url="$RUN_URL" > /dev/null \
              || echo "::warning title=Check no escrito::no se pudo poner el estado tokens-sync en $ROBOT_SHA."
            if gh pr view design-tokens-sync --json state --jq .state 2>/dev/null | grep -q OPEN; then
              # La portada se REESCRIBE en cada run: así el sha verificado es siempre el del último.
              gh pr edit design-tokens-sync --body-file "$RUNNER_TEMP/body.md" && echo "PR ya abierto — portada actualizada." \
                || echo "::warning title=Portada no actualizada::gh pr edit falló; el sha verificado es $ROBOT_SHA."
            elif gh pr create --base main --head design-tokens-sync --title "chore(tokens): sync del Theme Designer" --body-file "$RUNNER_TEMP/body.md"; then
              echo "PR abierto."
            else
              echo "::warning title=PR no abierto::Habilita Settings -> Actions -> General -> 'Allow GitHub Actions to create and approve pull requests'."
            fi
          fi

      # El run sale del color del veredicto: los pasos de arriba no cortan el job para que el PR
      # se escriba siempre, así que el rojo se declara aquí.
      - name: Veredicto del run
        if: always()
        env:
          IMPORT: ${{ steps.import.outcome }}
          CEROS: ${{ steps.ceros.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          REFERENCIAS: ${{ steps.referencias.outcome }}
        run: |
          if [ "$IMPORT" != "success" ] || [ "$CEROS" != "success" ] || [ "$VERIFY" != "success" ]; then exit 1; fi
          if [ "$E2E" != "success" ] && [ "$REFERENCIAS" != "success" ]; then exit 1; fi
          echo "Verde."
