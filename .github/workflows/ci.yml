# Gate de CI — los guardarraíles del DS en verde o el cambio no entra.
# Corre lo que el script `preflight` (package.json) corre en local —verify (tokens
# gen+parity+guard+type-parity, escala, unit, docs, build, typecheck, lint) y los builds de
# las 4 apps— MÁS las suites e2e, que desde DD-60 (2026-09-09) solo corren aquí: son la
# parte lenta y en un portátil solo cabe un Playwright a la vez, así que con varias sesiones
# se hacían cola. Aquí cada job tiene su runner. La paridad preflight ≡ ci.yml (menos la lista
# cerrada CI_ONLY) la EXIGE un test unitario (`ci-preflight-parity`): si divergen, "preflight
# verde en local" deja de significar "el CI pasará".
#
# Las BASELINES VISUALES de sc-docs (`e2e:visual`) NO están aquí, y es una ausencia medida, no
# un olvido: sus capturas `-darwin.png` se generan en el Mac de Rafa y el runner `macos-latest`
# pinta el texto monoespaciado con otra métrica, así que fallan las 38 (ver DD-60). Mientras eso
# no se resuelva, las corre a mano quien toque sc-docs (`npm run e2e:visual`).
#
# ESTRUCTURA: jobs EN PARALELO (antes un solo job en serie de ~14 min). Cada job
# arranca en su propio runner; el reloj total es el del job MÁS LENTO, no la suma.
# En repo público los runners son gratis. El conjunto de comandos (unión de todos
# los jobs) es el MISMO que el de preflight: no se salta nada, solo corre a la vez.
#
# Los jobs de e2e reconstruyen el DS con `npm run build` porque cada runner arranca
# con `dist/` vacío y las apps consumen el DS desde `dist/`. En preflight ese build
# lo hace `verify` (su primer paso), así que el gate de paridad lo trata como setup,
# no como un paso propio (ver SETUP en ci-preflight-parity.mjs).
#
# El auto-merge de la auditoría (`audit-automerge.yml`) depende del WORKFLOW `ci` en
# conjunto (workflow_run + conclusion success), no de un job concreto → sigue bien.
name: ci

# El default de la ORG pasó a `read and write` el 2026-08-13 para que el auto-merge de la
# auditoría pudiera mergear. Ese default es el MÁXIMO que hereda todo workflow que no declare
# lo suyo — y este solo lee y construye. Se acota aquí para que el permiso ancho viva
# únicamente donde hace falta (`audit-automerge.yml`) y no en toda la casa por herencia.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# El PR de `design-tokens-sync` lo verifica el workflow `tokens-sync` (regenera
# primitivos antes de verificar); aquí lo saltamos para no dar un rojo de drift
# espurio. En el merge a main, esto corre igual (push → main). El guard va en cada
# job porque GitHub Actions no tiene un `if` a nivel de workflow.
jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'design-tokens-sync'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gate completo (tokens + escala + unit + docs + build + typecheck + lint)
        run: npm run verify

  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'design-tokens-sync'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build:docs construye el DS (npm run build) + sc-docs; luego las 3 apps
      # consumen el DS de dist/. Mismas cadenas que preflight, para la paridad.
      - name: Build docs (construye el DS + sc-docs)
        run: npm run build:docs
      - name: Build supervisor (la app real, consume el DS local)
        run: npx ng build supervisor --configuration production
      - name: Build agent (consume el DS local)
        run: npx ng build agent --configuration production
      - name: Build cuscare (consume el DS local)
        run: npx ng build cuscare --configuration production

  e2e-smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'design-tokens-sync'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build del DS (setup, no un paso de cabecera): la smoke levanta
      # `ng serve sc-docs`, que lo consume de dist/.
      - run: npm run build
      - name: e2e smoke (sc-docs)
        # Las baselines visuales de `components.spec.ts` son `*-darwin.png` y este
        # runner es ubuntu: aquí no pueden casar, así que se apagan explícitamente y
        # la red de este job son las métricas del Kit, que sí corren en todas partes.
        # Apagarlas es cosa de ESTA línea y de nadie más: en local (preflight incluido)
        # la suite las corre. Ver el porqué en `screenshotBaseline()`.
        env:
          SC_SKIP_VISUAL_BASELINES: '1'
        run: |
          # El runner trae preconfigurado el repo APT de Chrome, y `--with-deps` hace un
          # `apt-get update` que lee su índice. Si ese índice viene desincronizado
          # (`Hash Sum mismatch`), el paso muere ANTES de bajar nada: el 2026-09-09 tumbó
          # los tres jobs de e2e de `main` tres veces seguidas, con un árbol IDÉNTICO a uno
          # que había pasado verde una hora antes. De ese repo no se instala nada —
          # Playwright baja su propio chromium y `--with-deps` solo saca librerías del
          # sistema de los repos de Ubuntu— así que se quita y dejamos de depender de un
          # mirror ajeno para arrancar los tests.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          npx playwright install --with-deps chromium
          npm run e2e

      # Sin `name:` A PROPÓSITO: los pasos con nombre de este fichero son los GATES, y su
      # número está gateado contra la doc ("el CI son N pasos"). Esto no es un gate, es la
      # caja negra del accidente: solo corre al fallar, y es lo que convierte un rojo en algo
      # que se puede mirar en vez de adivinar.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-sc-docs
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
  e2e-supervisor:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'design-tokens-sync'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build del DS (setup, no un paso de cabecera): la app lo consume de dist/.
      - run: npm run build
      # Comportamiento de la app real: formularios (rellenar → validar → guardar)
      # y el flujo de reglas de punta a punta. Playwright levanta su propio
      # `ng serve` (:4405) — ver playwright.supervisor.config.ts.
      - name: e2e supervisor (formularios + flujo de reglas)
        run: |
          # El runner trae preconfigurado el repo APT de Chrome, y `--with-deps` hace un
          # `apt-get update` que lee su índice. Si ese índice viene desincronizado
          # (`Hash Sum mismatch`), el paso muere ANTES de bajar nada: el 2026-09-09 tumbó
          # los tres jobs de e2e de `main` tres veces seguidas, con un árbol IDÉNTICO a uno
          # que había pasado verde una hora antes. De ese repo no se instala nada —
          # Playwright baja su propio chromium y `--with-deps` solo saca librerías del
          # sistema de los repos de Ubuntu— así que se quita y dejamos de depender de un
          # mirror ajeno para arrancar los tests.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          npx playwright install --with-deps chromium
          npm run e2e:supervisor

      # Sin `name:` A PROPÓSITO: los pasos con nombre de este fichero son los GATES, y su
      # número está gateado contra la doc ("el CI son N pasos"). Esto no es un gate, es la
      # caja negra del accidente: solo corre al fallar, y es lo que convierte un rojo en algo
      # que se puede mirar en vez de adivinar.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-supervisor
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
  e2e-cuscare:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'design-tokens-sync'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build del DS (setup, no un paso de cabecera): la app lo consume de dist/.
      - run: npm run build
      # Gestos de CusCare (sidebar, engranaje, pestañas) + la métrica medida del
      # sitio original. Clics REALES: fue esta suite la que cazó que la barra
      # inferior tapaba el engranaje — se veía, pero no se podía pulsar.
      - name: e2e cuscare (navegación + métrica)
        run: |
          # El runner trae preconfigurado el repo APT de Chrome, y `--with-deps` hace un
          # `apt-get update` que lee su índice. Si ese índice viene desincronizado
          # (`Hash Sum mismatch`), el paso muere ANTES de bajar nada: el 2026-09-09 tumbó
          # los tres jobs de e2e de `main` tres veces seguidas, con un árbol IDÉNTICO a uno
          # que había pasado verde una hora antes. De ese repo no se instala nada —
          # Playwright baja su propio chromium y `--with-deps` solo saca librerías del
          # sistema de los repos de Ubuntu— así que se quita y dejamos de depender de un
          # mirror ajeno para arrancar los tests.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          npx playwright install --with-deps chromium
          npm run e2e:cuscare
      # Sin `name:` A PROPÓSITO: los pasos con nombre de este fichero son los GATES, y su
      # número está gateado contra la doc ("el CI son N pasos"). Esto no es un gate, es la
      # caja negra del accidente: solo corre al fallar, y es lo que convierte un rojo en algo
      # que se puede mirar en vez de adivinar.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cuscare
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
