# Gate de CI — los guardarraíles del DS en verde o el cambio no entra.
# Corre EL MISMO `npm run verify` que el gate local y el workflow tokens-sync
# (tokens gen+parity+guard+type-parity, escala, unit, docs-guard/coherence, build,
# typecheck, lint), más los builds de las 4 apps y las 3 suites e2e.
#
# ESTRUCTURA: jobs EN PARALELO (antes era un solo job en serie de ~14 min). Cada
# job arranca en su propio runner (checkout + node + npm ci), así que el reloj
# total es el del job MÁS LENTO, no la suma. En repo público los runners son
# gratis e ilimitados. Misma cobertura y mismas puertas que antes: no se salta
# nada, solo corre a la vez.
#
# Coste del paralelismo: el DS (`npm run build`) se reconstruye en cada job que lo
# necesita (builds y e2e consumen el DS desde `dist/`) en vez de una sola vez. Es
# tiempo de runner gratis. Si algún día molesta, la vía es construir el DS una vez
# y compartirlo con `actions/upload-artifact` + `download-artifact`.
#
# El auto-merge de la auditoría (`audit-automerge.yml`) depende del WORKFLOW `ci`
# en conjunto (`workflow_run` + conclusion success), no de un job concreto: sigue
# funcionando mientras todos los jobs pasen y el workflow se llame `ci`.
name: ci

# El default de la ORG pasó a `read and write` el 2026-08-13 para que el auto-merge de la
# auditoría pudiera mergear. Ese default es el MÁXIMO que hereda todo workflow que no declare
# lo suyo — y este solo lee y construye. Se acota aquí para que el permiso ancho viva
# únicamente donde hace falta (`audit-automerge.yml`) y no en toda la casa por herencia.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# El PR de `design-tokens-sync` lo verifica el workflow `tokens-sync` (regenera
# primitivos antes de verificar); aquí lo saltamos para no dar un rojo de drift
# espurio. En el merge a main, esto corre igual (push → main). El guard va en cada
# job porque GitHub Actions no tiene un `if` a nivel de workflow.
jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'design-tokens-sync'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gate completo (tokens + escala + unit + docs + build + typecheck + lint)
        run: npm run verify

  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'design-tokens-sync'
    name: build (${{ matrix.app }})
    strategy:
      # Un build que falla no cancela a los otros tres — así se ve de un vistazo
      # cuáles apps rompen, no solo la primera.
      fail-fast: false
      matrix:
        app: [docs, supervisor, agent, cuscare]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build ${{ matrix.app }} (producción, consume el DS local)
        # build:<app> arranca con `npm run build` (construye el DS a dist/) y luego
        # `ng build <app> --configuration production`.
        run: npm run build:${{ matrix.app }}

  e2e-smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'design-tokens-sync'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build DS (la smoke levanta `ng serve sc-docs`, que lo consume de dist/)
        run: npm run build
      - name: e2e smoke (sc-docs)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  e2e-supervisor:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'design-tokens-sync'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build DS (la app lo consume desde dist/)
        run: npm run build
      # Comportamiento de la app real: formularios (rellenar → validar → guardar)
      # y el flujo de reglas de punta a punta. Playwright levanta su propio
      # `ng serve` (:4405) — ver playwright.supervisor.config.ts.
      - name: e2e supervisor (formularios + flujo de reglas)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e:supervisor

  e2e-cuscare:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'design-tokens-sync'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build DS (la app lo consume desde dist/)
        run: npm run build
      # Gestos de CusCare (sidebar, engranaje, pestañas) + la métrica medida del
      # sitio original. Clics REALES: fue esta suite la que cazó que la barra
      # inferior tapaba el engranaje — se veía, pero no se podía pulsar.
      - name: e2e cuscare (navegación + métrica)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e:cuscare
