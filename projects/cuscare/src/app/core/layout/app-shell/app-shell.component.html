<div class="shell">
  <aside class="nav">
    <div class="nav__brand">
      <div class="nav__logo" aria-hidden="true">
        <!-- Logo REAL descargado de la app (44×45, el mismo fichero que sirve). -->
        <img src="icons/menu/logo-cuscare.png" width="44" height="45" alt="" />
      </div>
      <span class="nav__env">development</span>
    </div>

    <nav class="nav__body" [attr.aria-label]="'Main' | tr">
      @for (item of navItems; track item.path) {
        <a
          class="nav__item"
          [class.is-active]="isActive()(item.path)"
          [routerLink]="item.path"
          [attr.aria-current]="isActive()(item.path) ? 'page' : null"
        >
          <app-nav-icon [name]="item.icon" />
          <span class="nav__label">{{ item.label | tr }}</span>
        </a>
      }
    </nav>

    <div class="nav__settings">
      @if (settingsOpen()) {
        <ul class="settingsmenu" role="menu">
          @for (s of settingsItems; track s.path) {
            <li role="none">
              <a
                class="settingsmenu__item"
                role="menuitem"
                [routerLink]="s.path"
                (click)="settingsOpen.set(false)"
                >{{ s.label | tr }}</a
              >
            </li>
          }
          <!-- Idioma de la réplica (propio, no está en el original): se aplica al momento. -->
          <li class="settingsmenu__sep" role="separator"></li>
          <li class="settingsmenu__group" role="none">{{ 'Language' | tr }}</li>
          @for (l of langs; track l.value) {
            <li role="none">
              <button
                class="settingsmenu__item settingsmenu__item--lang"
                type="button"
                role="menuitemradio"
                [attr.aria-checked]="i18n.lang() === l.value"
                (click)="i18n.set(l.value)"
              >
                <span class="settingsmenu__check" aria-hidden="true">{{ i18n.lang() === l.value ? '✓' : '' }}</span>{{ l.label }}
              </button>
            </li>
          }
        </ul>
      }
      <button
        class="nav__gear"
        type="button"
        (click)="settingsOpen.set(!settingsOpen())"
        [attr.aria-expanded]="settingsOpen()"
        [attr.aria-label]="'Settings' | tr"
      >
        <app-nav-icon name="gear" />
        <span class="nav__gear-caret">{{ settingsOpen() ? '<' : '>' }}</span>
      </button>
    </div>
  </aside>

  <main class="content-main">
    <router-outlet />
  </main>
</div>

<footer class="statusbar">
  <!-- Dentro de un ticket el pill cambia a "Managed ticket" y se DESHABILITA:
       gestionando un ticket no puedes tocar tu disponibilidad. Medido en la
       real (clase `status no-available disabled`). -->
  <button
    class="statusbar__pill"
    [class.statusbar__pill--ok]="available() && !managingTicket()"
    type="button"
    [disabled]="managingTicket()"
    (click)="available.set(!available())"
    [attr.aria-pressed]="available()"
  >
    {{ (managingTicket() ? 'Managed ticket' : available() ? 'Available' : 'No available') | tr }}
  </button>
  <span class="statusbar__avatar" aria-hidden="true">RA</span>
</footer>

<!-- Los avisos de la app: arriba a la derecha, fijos. -->
<app-toaster />
