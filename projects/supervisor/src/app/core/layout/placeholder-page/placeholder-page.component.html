<div class="placeholder">
  <!-- Decorativa: el título ya dice lo que pasa. Ancho y alto puestos para que no salte al cargar. -->
  <img class="placeholder__art" [src]="artSrc()" alt="" width="700" height="525" />
  <div class="placeholder__text">
    <h2 class="placeholder__title sc-text-h3-semibold">{{ 'placeholder.title' | translate }}</h2>
    <p class="placeholder__subtitle sc-text-body-regular">{{ 'placeholder.subtitle' | translate }}</p>
  </div>
</div>
