<aside
  class="sidebar"
  [class.sidebar--pinned]="pinned()"
  [class.sidebar--expanded]="hovered()"
  [class.sidebar--anchored]="anchored()"
  [attr.aria-label]="'sidebar.nav_aria' | translate"
  (mouseenter)="onEnter()"
  (mouseleave)="onLeave()"
  (focusin)="focusWithin.set(true)"
  (focusout)="onFocusOut($event)"
>
  <a class="sidebar__brand" routerLink="/" [attr.aria-label]="'app.name' | translate">
    <img
      class="sidebar__brand-isotype"
      src="/logos/smartcontact-isotype-light.svg"
      width="40"
      height="40"
      alt=""
      aria-hidden="true"
    />
    <img
      class="sidebar__brand-wordmark"
      src="/logos/smartcontact-wordmark-light.svg"
      height="40"
      [attr.alt]="'app.logo_alt' | translate"
    />
  </a>

  <!-- Anclar, como el Drawer de Apollo: deja el sidebar desplegado y la página le deja su hueco. -->
  <button
    type="button"
    class="sidebar__anchor"
    [class.sidebar__anchor--on]="anchored()"
    [attr.aria-pressed]="anchored()"
    [attr.aria-label]="'sidebar.anchor_aria' | translate"
    (click)="anchored.set(!anchored())"
  >
    <sc-icon name="keep" [size]="14" [filled]="anchored()" />
  </button>

  <nav class="sidebar__nav">
    @for (section of sections; track trackBySectionTitle($index, section)) {
      <div class="sidebar__section">
        <div class="sidebar__section-slot">
          <span class="sidebar__section-divider" aria-hidden="true"></span>
          <span class="sidebar__section-title sc-text-caption-semibold">{{ section.titleKey | translate }}</span>
        </div>
        <div class="sidebar__section-items">
          @for (item of section.items; track trackByItemKey($index, item)) {
            <sc-sidebar-nav-item
              [item]="item"
              [currentPath]="currentPath()"
              [openKeys]="shownOpenKeys()"
              [accentKey]="accentKey()"
              (navigate)="onNavigate($event)"
              (toggleOpen)="onToggle($event)"
            />
          }
        </div>
      </div>
    }
  </nav>
</aside>
