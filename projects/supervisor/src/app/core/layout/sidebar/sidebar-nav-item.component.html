<button
  type="button"
  class="nav-item sc-text-body-regular"
  [class.nav-item--active]="isActive()"
  [class.nav-item--child-active]="item().labelKey === accentKey()"
  [class.nav-item--parent]="hasChildren()"
  [class.nav-item--expanded]="effectivelyExpanded()"
  [attr.data-depth]="depth()"
  (click)="onClick($event)"
>
  <sc-icon
    class="nav-item__icon"
    [name]="resolveIcon(item().icon)"
    [size]="item().iconSize ?? 14"
  />
  <span class="nav-item__label">{{ item().labelKey | translate }}</span>
  @if (hasChildren()) {
    <sc-icon
      class="nav-item__chevron"
      [name]="resolveIcon('chevron-right')"
      [size]="14"
    />
  }
</button>

@if (hasChildren()) {
  <!-- Always rendered so opening and closing can animate; `inert` keeps closed rows out of reach. -->
  <div
    class="nav-item__children"
    [class.nav-item__children--open]="effectivelyExpanded()"
    [attr.inert]="effectivelyExpanded() ? null : ''"
  >
    <div class="nav-item__children-inner">
      @for (child of item().children; track child.labelKey) {
        <sc-sidebar-nav-item
          [item]="child"
          [depth]="depth() + 1"
          [currentPath]="currentPath()"
          [openKeys]="openKeys()"
          [accentKey]="accentKey()"
          (navigate)="navigate.emit($event)"
          (toggle)="toggle.emit($event)"
        />
      }
    </div>
  </div>
}
