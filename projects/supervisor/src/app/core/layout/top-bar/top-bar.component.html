<header class="top-bar">
  <div class="top-bar__lead">
    <button
      type="button"
      class="top-bar__home"
      (click)="goToDashboard()"
      [attr.aria-label]="'topbar.go_to_dashboard' | translate"
      [attr.title]="'topbar.go_to_dashboard' | translate"
    >
      <sc-icon name="space_dashboard" size="inherit" />
    </button>
    <!-- Un solo motor de identidad en el lead: el breadcrumb. El slot `lead`
         (S59) permitía a una página sustituirlo por su propia cabecera; lo
         usaba solo el constructor de reglas y rompía la convergencia — dos
         formas distintas de decir dónde estás. Muere en la Ola 1. -->
    @if (trail().length > 0) {
      <span class="top-bar__lead-divider" aria-hidden="true"></span>
      <!-- La miga la pinta `sc-breadcrumb` (puente Figma→código), idéntica a
           Figma. El botón de inicio (space_dashboard) se queda aparte a la
           izquierda: es la afordancia persistente "ir al dashboard", no el
           `home` genérico del breadcrumb.
           `flush`: la barra ya pone su aire; con el relleno propio de la miga
           medía 91 en vez de 75 (2026-09-14). -->
      <sc-breadcrumb class="top-bar__breadcrumb" flush [model]="crumbModel()" />
    }
  </div>

  <!-- Slot contextual: la página activa puede inyectar chrome propio aquí
       (p.ej. el selector de datos demo de Memory). Vacío en la mayoría de
       rutas. Se renderiza con NgComponentOutlet → cero acoplamiento al shell. -->
  @if (slotComponent(); as slot) {
    <div class="top-bar__slot">
      <ng-container *ngComponentOutlet="slot" />
    </div>
  }

  <!-- Acciones primarias de la página (CTA en listas, Guardar/Cancelar en
       formularios) proyectadas vía template → modelo "todo arriba" (S59). -->
  <!-- El resultado de la última acción, junto a los botones que la lanzaron (DD-191). La zona está
       siempre en el DOM, también sin acciones (el Monitor), para que el lector de pantalla anuncie
       lo que entra en ella. -->
  <div class="top-bar__resultado" role="status">
    @if (resultado(); as r) {
      <sc-message severity="success" variant="simple" size="sm" icon="check_circle" [text]="r" />
    }
  </div>

  @if (slotActions(); as actions) {
    <div class="top-bar__actions">
      <ng-container [ngTemplateOutlet]="actions" />
    </div>
  }

  <div class="top-bar__user">
    <button
      type="button"
      class="top-bar__avatar"
      [class.top-bar__avatar--open]="userMenuOpen()"
      aria-haspopup="menu"
      [attr.aria-expanded]="userMenuOpen()"
      [attr.aria-controls]="userMenuId"
      [attr.aria-label]="userName"
      (click)="userMenu.toggle($event)"
    >
      <sc-illustrated-avatar [name]="userName" size="var(--sc-cmp-avatar-width)" />
      <span class="top-bar__avatar-presence" aria-hidden="true"></span>
    </button>

    <!-- El menú de primeng.dev con `popup` (candidato 4 del barrido): mete el foco, flechas, Inicio, Fin y Escape,
         que devuelve el foco al avatar. La identidad va en `#start`, como en su ejemplo «template»; los atajos son
         una opción más, porque un botón dentro de `#start` no se alcanza con el teclado (medido el 2026-10-15). -->
    <p-menu
      #userMenu
      [id]="userMenuId"
      [model]="userMenuItems()"
      [popup]="true"
      appendTo="body"
      [ariaLabel]="userName"
      (onShow)="userMenuOpen.set(true)"
      (onHide)="userMenuOpen.set(false)"
    >
      <ng-template #start>
        <div class="top-bar__menu-identity">
          <sc-illustrated-avatar [name]="userName" [size]="44" />
          <div class="top-bar__menu-meta">
            <span class="top-bar__menu-name sc-text-body-semibold">{{ userName }}</span>
            <span class="top-bar__menu-role">
              {{ 'topbar.user.role_admin' | translate }}, {{ userPhone }}
            </span>
          </div>
        </div>
      </ng-template>
    </p-menu>
  </div>
</header>
