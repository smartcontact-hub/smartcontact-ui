<!-- Los siete días siempre a la vista, cada uno con su fila de horas (vacía hasta que se rellena). El reloj tachado marca el día como
     cerrado: un día sin franjas puede estar solo sin configurar. -->
<ul class="semana" role="list">
  @for (dia of dias(); track dia.indice) {
    <li class="semana__dia" [class.semana__dia--cerrado]="dia.cerrado">
      <span class="semana__nombre sc-text-body-semibold">{{ dia.nombre }}</span>
      @if (dia.cerrado) {
        <span class="semana__cerrado sc-text-body-semibold"><sc-icon name="alarm_off" [size]="16" aria-hidden="true" />{{ 'repositories.horarios.closed' | translate }}</span>
      } @else {
        <sc-horario-franjas class="semana__franjas" [franjas]="dia.franjas" [conVacia]="true" [etiqueta]="dia.nombre" (franjasChange)="ponerDia(dia.indice, $event)" />
      }
      <button
        type="button"
        class="semana__cierre"
        [class.semana__cierre--puesto]="dia.cerrado"
        [attr.aria-pressed]="dia.cerrado"
        [attr.aria-label]="(dia.cerrado ? 'repositories.horarios.sv.reopen' : 'repositories.horarios.sv.mark_closed') | translate"
        [pTooltip]="(dia.cerrado ? 'repositories.horarios.sv.reopen' : 'repositories.horarios.sv.mark_closed') | translate"
        tooltipPosition="left"
        (click)="alternarCierre(dia.indice, !dia.cerrado)"
      >
        <sc-icon name="alarm_off" [size]="18" aria-hidden="true" />
      </button>
      @if (falta()?.dia === dia.indice) {
        <p class="semana__error field__error sc-text-caption-regular" role="alert">{{ 'repositories.horarios.errors.week_' + falta()!.codigo | translate }}</p>
      }
    </li>
  }
</ul>
