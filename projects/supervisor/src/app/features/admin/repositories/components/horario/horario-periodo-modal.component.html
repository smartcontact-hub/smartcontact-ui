<sc-custom-modal
  [visible]="true"
  width="44rem"
  [title]="(periodo() ? 'repositories.horarios.period_edit' : 'repositories.horarios.period_add') | translate"
  (closed)="cerrado.emit()"
>
  <div class="modal-horario">
    <div class="grid grid--2">
      <div class="field">
        <sc-inputtext
          inputId="periodo-nombre"
          fluid
          required
          [label]="'repositories.columns.name' | translate"
          [placeholder]="'repositories.horarios.period_name_placeholder' | translate"
          [value]="nombre()"
          [error]="errorDeNombre()"
          (valueChange)="nombre.set($event)"
          (focusout)="dejarNombre($event)"
        />
      </div>
      <div class="field">
        <sc-datepicker
          inputId="periodo-fechas"
          selectionMode="range"
          required
          [label]="'repositories.horarios.period_dates' | translate"
          [placeholder]="'repositories.horarios.period_dates_placeholder' | translate"
          [range]="rango()"
          [error]="errorDeFechas()"
          [helperText]="resumen()"
          (rangeChange)="rango.set($event)"
        />
      </div>
    </div>

    <div class="modal-horario__fila">
      <sc-toggleswitch inputId="periodo-anual" [checked]="cadaAnio()" ariaLabelledBy="periodo-anual-rotulo" (checkedChange)="cadaAnio.set($event)" />
      <label class="sc-text-body-regular" id="periodo-anual-rotulo" for="periodo-anual">{{ 'repositories.horarios.repeat_yearly' | translate }}</label>
    </div>

    <div class="field">
      <span class="field__label sc-text-caption-semibold">{{ 'repositories.horarios.period_color' | translate }}</span>
      <sc-color-dot-picker [options]="colores()" [value]="color()" (valueChange)="color.set($event)" [ariaLabel]="'repositories.horarios.period_color' | translate" />
    </div>

    <div class="field">
      <span class="field__label sc-text-caption-semibold">{{ 'repositories.horarios.period_week' | translate }}</span>
      <sc-horario-semana prefijo="periodo" [semana]="semana()" [falta]="faltaDeSemana()" (semanaChange)="semana.set($event)" />
    </div>
  </div>

  <div scCustomModalFooter class="modal-horario__pie">
    <sc-button variant="secondary" appearance="outlined" [label]="'common.cancel' | translate" (clicked)="cerrado.emit()" />
    <sc-button
      variant="primary"
      [disabled]="!puedeGuardar()"
      [pTooltip]="motivoApagado()"
      tooltipPosition="top"
      tooltipEvent="both"
      [label]="(periodo() ? 'common.save' : 'repositories.horarios.period_add_submit') | translate"
      (clicked)="confirmar()"
    />
  </div>
</sc-custom-modal>
