<div class="reglas">
  <!-- Fila 1: la semana habitual y los periodos, en `sc-section-card` como el resto de fichas. -->
  <div class="reglas__fila">
    <sc-section-card titleKey="repositories.horarios.section_week" hintKey="repositories.horarios.section_week_hint" surface="subtle">
      <sc-subsection>
        <div class="bloque">
          <ul class="semana" role="list">
            @for (dia of dias(); track $index) {
              <li class="semana__dia">
                <span class="semana__nombre sc-text-body-regular">{{ dia.nombre }}</span>
                <span class="semana__tramos">
                  @for (t of dia.tramos; track t) {
                    <sc-tag variant="label" labelColor="blue" [value]="t" />
                  } @empty {
                    <sc-tag severity="secondary" [value]="'repositories.horarios.closed' | translate" />
                  }
                </span>
              </li>
            }
          </ul>
          <sc-button
            class="bloque__accion"
            variant="secondary"
            appearance="outlined"
            size="sm"
            icon="edit"
            [label]="'repositories.horarios.x.rules.week_edit' | translate"
            (clicked)="editarSemana.emit()"
          />
        </div>
      </sc-subsection>
    </sc-section-card>

    <sc-section-card titleKey="repositories.horarios.section_periods" hintKey="repositories.horarios.section_periods_hint" surface="subtle">
      <sc-subsection>
        <div class="bloque">
          <sc-horario-filas-table
            [filas]="filasDePeriodos()"
            [columnas]="columnasDePeriodos()"
            anadirKey="repositories.horarios.period_add"
            vacioKey="repositories.horarios.periods_empty"
            vacioCuerpoKey="repositories.horarios.periods_empty_body"
            vacioIcono="date_range"
            (abrir)="abrirPeriodo.emit($event)"
            (eliminar)="eliminarPeriodo.emit($event)"
            (anadir)="anadirPeriodo.emit()"
          />
        </div>
      </sc-subsection>
    </sc-section-card>
  </div>

  <!-- Fila 2: las fechas especiales y los festivos, a lo ancho. Dos grupos en la misma tarjeta, a 28 entre ellos. -->
  <sc-section-card titleKey="repositories.horarios.section_specials" hintKey="repositories.horarios.section_specials_hint" surface="subtle">
    <sc-subsection titleKey="repositories.horarios.holiday_calendars">
      <div class="bloque">
        <div class="festivos">
          <sc-multiselect
            inputId="horario-festivos"
            display="chip"
            chipOverflow="fit"
            [filter]="true"
            [ariaLabel]="'repositories.horarios.holiday_calendars' | translate"
            [placeholder]="'repositories.horarios.holiday_calendars_placeholder' | translate"
            [helperText]="'repositories.horarios.holiday_calendars_help' | translate"
            [options]="opcionesDeFestivos()"
            optionLabel="label"
            optionValue="value"
            [value]="$any(festivosAplicados())"
            (valueChange)="cambiarFestivos.emit($any($event) ?? [])"
          />
        </div>
        <a class="repo-link sc-text-caption-semibold" [href]="festivosHref()" (click)="gestionarFestivos.emit($event)">{{ 'repositories.horarios.manage_holidays' | translate }}</a>
      </div>
    </sc-subsection>

    <sc-subsection titleKey="repositories.horarios.specials_own">
      <div class="bloque">
        <sc-horario-filas-table
          [filas]="filasDeEspeciales()"
          [columnas]="columnasDeEspeciales()"
          anadirKey="repositories.horarios.special_add"
          [vacioKey]="verPasadas() ? 'repositories.horarios.specials_past_empty' : 'repositories.horarios.specials_empty'"
          [vacioCuerpoKey]="verPasadas() ? null : 'repositories.horarios.specials_empty_body'"
          vacioIcono="event_busy"
          (abrir)="abrirEspecial.emit($event)"
          (eliminar)="eliminarEspecial.emit($event)"
          (anadir)="anadirEspecial.emit()"
        >
          <sc-selectbutton
            filasBarra
            size="sm"
            [ariaLabel]="'repositories.horarios.specials_filter' | translate"
            [options]="filtroDeEspeciales()"
            optionLabel="label"
            optionValue="value"
            [allowEmpty]="false"
            [value]="verPasadas() ? 'pasadas' : 'proximas'"
            (valueChange)="verPasadas.set($event === 'pasadas')"
          />
        </sc-horario-filas-table>
      </div>
    </sc-subsection>
  </sc-section-card>
</div>
