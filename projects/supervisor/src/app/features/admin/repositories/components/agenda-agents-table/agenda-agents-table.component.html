<div class="agents">
  <div class="agents__bar">
    <sc-search
      class="agents__search"
      [placeholder]="'repositories.agendas.agents_search' | translate"
      [clearAriaLabel]="'labels.clear_search' | translate"
      [value]="query()"
      (valueChange)="query.set($event)"
    />
    <sc-selectbutton
      [options]="filterOptions()"
      optionValue="value"
      [allowEmpty]="false"
      [value]="filter()"
      (valueChange)="filter.set($any($event))"
      [ariaLabel]="'repositories.agendas.agents_filter_aria' | translate"
    />
    <span class="agents__summary sc-text-caption-regular" role="status">{{ summary() }}</span>
  </div>

  <div class="table-card">
    <sc-datatable
      variant="list"
      dataKey="id"
      selectionMode="multiple"
      [value]="visibles()"
      [columns]="columns()"
      [selection]="marcadas()"
      (selectionChange)="onSelectionChange($event)"
      [rowSelectionAriaLabel]="rowLabel"
      [selectAllAriaLabel]="'repositories.agendas.agents_select_all' | translate"
      [paginator]="visibles().length > 0"
      [(first)]="first"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
    >
      <div scTableEmpty>
        @if (query() || filter() === 'assigned') {
          <sc-empty-state
            icon="search_off"
            titleKey="labels.no_results.title"
            [bodyKey]="filter() === 'assigned' && !query() ? 'repositories.agendas.agents_none_assigned' : 'repositories.agendas.agents_no_results'"
            [params]="{ query: query() }"
            ctaKey="labels.clear_search"
            ctaIcon="close"
            (cta)="query.set(''); filter.set('all')"
          />
        } @else {
          <sc-empty-state icon="headphones" titleKey="repositories.agendas.agents_empty" />
        }
      </div>
    </sc-datatable>
  </div>
</div>

<ng-template #emailTpl let-row>
  @if (row.email) {
    {{ row.email }}
  } @else {
    <sc-celda-vacia />
  }
</ng-template>
