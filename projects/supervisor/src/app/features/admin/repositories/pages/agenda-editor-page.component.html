<!-- Guardar y Deshacer suben a la barra de arriba, como en las fichas: apagado mientras falte algo, con el motivo en su
     tooltip (DD-219); «Deshacer», solo si hay algo que deshacer. -->
<ng-template #topbarActions>
  @if (mode() === 'edit' && formDirty()) {
    <span class="form-save-reason sc-text-caption-regular" role="status">{{ 'common.unsaved_changes' | translate }}</span>
  }
  @if (formDirty()) {
    <sc-button variant="secondary" appearance="outlined" [label]="'common.undo' | translate" (clicked)="discard()" />
  }
  <sc-button
    variant="primary"
    [disabled]="!canSave()"
    [pTooltip]="motivoApagado()" tooltipPosition="top"
    [label]="(mode() === 'create' ? 'repositories.agendas.create_submit' : 'common.save') | translate"
    (clicked)="save()"
  />
</ng-template>

<div class="page">
  <div class="page__inner">
    <!-- La identidad, como en las fichas: el nombre de la agenda, o «Nueva agenda» mientras no lo tiene. -->
    <h1 class="page__heading sc-text-title-semibold">{{ form().name.trim() || ('repositories.agendas.create_title' | translate) }}</h1>


    <sc-section-card titleKey="repositories.agendas.section_general" surface="subtle" icon="tune">
      <sc-subsection>
<div class="bloque">
        <div class="grid grid--2">
          <div class="field">
            <sc-inputtext
              inputId="agenda-name"
              fluid
              required
              [label]="'repositories.agendas.col_title' | translate"
              [value]="form().name"
              [helperText]="nameHint()"
              [error]="nameError()"
              (valueChange)="update('name', $event)"
              (focusout)="dejarNombre($event)"
            />
          </div>
          <div class="field field--full">
            <sc-inputtext
              inputId="agenda-description"
              fluid
              [label]="'repositories.columns.description' | translate"
              [placeholder]="'repositories.placeholders.description' | translate"
              [value]="form().description"
              (valueChange)="update('description', $event)"
            />
          </div>
        </div>
      </div>
</sc-subsection>
    </sc-section-card>

    <sc-section-card titleKey="repositories.agendas.contacts" surface="subtle" icon="call">
      <sc-subsection>
<div class="bloque">
        <sc-agenda-contacts-table
          [contacts]="form().contacts"
          [fields]="contactColumns()"
          (add)="contactDialog.set({ contact: null })"
          (importar)="abrirImportar()"
          (edit)="contactDialog.set({ contact: $event })"
          (remove)="removeContact($event)"
          (removeMany)="removeContacts($event)"
        />
      </div>
</sc-subsection>
    </sc-section-card>

    <!-- A quién se asigna, la última sección: una tabla de agentes con sus grupos (COA SISMAC-4440). Solo a agentes. -->
    <sc-section-card titleKey="repositories.agendas.section_agents" surface="subtle" icon="headphones">
      <sc-subsection>
<div class="bloque">
        <sc-agent-assignment-table
          [agents]="agentsStore.agents()"
          [assigned]="form().agentIds"
          [editing]="mode() === 'edit'"
          rowAriaKey="repositories.agendas.agents_row_aria"
          (assignedChange)="update('agentIds', $event)"
        />
      </div>
</sc-subsection>
    </sc-section-card>
  </div>
</div>

<!-- Añadir o editar un contacto con el formulario de los «+» de Recursos (`sc-repo-form-panel`, a sangre en el
     diálogo). Ningún campo obligatorio: `validateContact` pide al menos uno con texto y, si hay teléfono, que valga. -->
@if (contactDialog(); as dialog) {
  <sc-custom-modal
    [visible]="true"
    width="46rem"
    [title]="(dialog.contact ? 'repositories.agendas.edit_contact' : 'repositories.agendas.add_contact') | translate"
    (closed)="contactDialog.set(null)"
  >
    <sc-repo-form-panel
      flush
      twoColumns
      [showOptional]="false"
      [fields]="contactFields()"
      [initial]="dialog.contact"
      [entitySingular]="'repositories.agendas.contact' | translate"
      [nameRequired]="false"
      [validate]="validateContact"
      (save)="onContactSave($event)"
      (cancelled)="contactDialog.set(null)"
    />
  </sc-custom-modal>
}

<!-- Importar contactos de un CSV, como en Voice (DD-166): la plantilla, el archivo y, antes de añadir nada, qué entra y
     qué no. Lo que entra va al formulario, sin guardar. -->
@if (importOpen()) {
  <sc-import-dialog
    [title]="'repositories.agendas.import_title' | translate"
    [summary]="importResumen()"
    (templateRequest)="descargarPlantilla()"
    (fileSelected)="onImportFile($event)"
    (confirmed)="confirmarImportar()"
    (cancelled)="cerrarImportar()"
  />
}
