<!-- Esta página fue la ÚLTIMA que llevó la banda de cabecera del DS, y lo que
     sobraba de aquella banda no era el título: era la banda —icono, borde,
     sombra y `position: sticky`— compitiendo con la rejilla de destinos. S59 se
     la llevó entera y de paso escondió el `<h1>`; lo que hay ahora es solo la
     línea de título, sin chrome. Mismo patrón que las nueve listas.

     El componente se retiró del DS el 2026-08-24 al quedarse sin consumidores.
     Se le quita el nombre a este comentario a propósito: mientras lo llevaba,
     `component-audit` lo contaba como un USO y el inventario decía "1 uso en
     supervisor" de un componente que no usaba nadie. Un componente muerto
     citado en un comentario seguía pareciendo vivo. -->
<div class="hub">
  <div class="hub__inner page__inner page__inner--hub">
    <!-- El título de la página vive en el CUERPO, no en la barra: la miga de
         arriba dice DÓNDE estás y esta línea dice QUÉ miras (modelo Snow UI,
         medido en `/orders`). Es el MISMO `<h1>` que S59 dejó oculto —no hay un
         encabezado nuevo—, así que sigue habiendo exactamente uno por documento. -->
    <h1 class="page__heading sc-text-h3-semibold">{{ 'sidebar.repositories' | translate }}</h1>

    <!-- El Menu del DS en línea (DD-77): grupo, fila, hover, foco y teclado los pone el tema.
         La plantilla `#item` es la de primeng.dev («Menu › Template»): la página solo aporta el
         contenido de la fila. -->
    <p-menu [model]="menu()" [style]="{ width: '100%' }" data-testid="repositorios-hub">
      <!-- `data-pc-section="itemlink"` es la marca con la que el Menu reconoce SU enlace: con ella,
           Enter pulsa este `<a>` y navega. Sin ella pulsaba el `<li>`, que no tiene manejador, y
           Enter no hacía nada (medido 2026-09-13). -->
      <ng-template #item let-item>
        <a class="p-menu-item-link" data-pc-section="itemlink" [routerLink]="item.routerLink">
          <span class="p-menu-item-icon" aria-hidden="true">
            <sc-icon [name]="item.icon" size="inherit" />
          </span>
          <span class="hub-link__text">
            <span class="sc-text-body-semibold">{{ item.label }}</span>
            <span class="hub-link__description sc-text-caption-regular">{{ item.title }}</span>
          </span>
        </a>
      </ng-template>
    </p-menu>
  </div>
</div>
