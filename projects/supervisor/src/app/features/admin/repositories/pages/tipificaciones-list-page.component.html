<ng-template #topbarActions>
  <sc-button class="top-bar__cta" type="button" variant="primary" (clicked)="onCreateClick()">
    <sc-icon [name]="plusIcon" size="inherit" />
    <span>{{ 'repositories.tipificaciones.create_title' | translate }}</span>
  </sc-button>
</ng-template>

<!-- La lista la monta `sc-list-page` (DD-97). Importar y exportar, detrás del botón «Acciones» (`importable`); la plantilla, en el diálogo de importar. -->
<sc-list-page
  [heading]="'repositories.tipificaciones.title' | translate"
  [rows]="rows()"
  [columns]="columns()"
  [columnChoices]="columnDefs()"
  [columnStorageKey]="columnPrefKey"
  [searchPlaceholder]="'repositories.tipificaciones.search_placeholder' | translate"
  [searchFn]="matchesSearch"
  [sortFn]="compare"
  noResultsKey="repositories.tipificaciones.no_results_query"
  exportable
  importable
  [rowMenu]="rowMenu"
  [selectionMenu]="selectionMenu"
  rowOpenable
  selectable
  [(selectedIds)]="selectedIds"
  tableTestId="tipificaciones-table"
  (rowOpen)="onRowOpen($event)"
  (exportRequest)="onExport($event)"
  (importRequest)="abrirImportar()"
>
  <sc-empty-state
    scListEmpty
    icon="checklist"
    titleKey="repositories.tipificaciones.empty_title"
    bodyKey="repositories.tipificaciones.empty_body"
    ctaKey="repositories.tipificaciones.create_title"
    (cta)="onCreateClick()"
  />
</sc-list-page>

<ng-template #nameTpl let-t>
  <span class="table__td-name sc-text-body-semibold" [pTooltip]="t.name" showOnEllipsis tooltipPosition="top">{{ t.name }}</span>
</ng-template>

<ng-template #descriptionTpl let-t>
  @if (t.description) {
    <span class="table__cell table__cell--truncate sc-text-body-regular" [pTooltip]="t.description" showOnEllipsis tooltipPosition="top">{{ t.description }}</span>
  } @else {
    <span class="table__cell sc-text-body-regular"><sc-celda-vacia /></span>
  }
</ng-template>

<!-- Cuántos niveles pide, y nada más: sin detalle al pasar. -->
<ng-template #levelsTpl let-t>
  <span class="table__cell sc-text-body-regular" [class.table__cell--muted]="sinNiveles(t)">{{ levelsLabel(t) }}</span>
</ng-template>

<ng-template #groupsTpl let-t>
  @let grupos = groupsOf(t);
  <sc-group-popover
    display="adaptive"
    [groups]="grupos"
    [countAriaLabel]="(grupos.length === 1 ? 'repositories.tipificaciones.groups_aria_one' : 'repositories.tipificaciones.groups_aria') | translate: { count: grupos.length }"
  />
</ng-template>

<!-- Eliminar una sola (fila sin marcar o ficha): este diálogo. Varias, con el «⋮» o el clic derecho sobre una marcada (`selectionMenu`, DD-227). -->
<!-- Importar de un CSV, como las agendas (DD-166): la plantilla, el archivo y, antes de crear nada, qué entra y qué no. -->
@if (importOpen()) {
  <sc-import-dialog
    [title]="'repositories.tipificaciones.import_title' | translate"
    [help]="importAyuda()"
    [summary]="importResumen()"
    (templateRequest)="descargarPlantilla()"
    (fileSelected)="onImportFile($event)"
    (confirmed)="confirmarImportar()"
    (cancelled)="cerrarImportar()"
  />
}
