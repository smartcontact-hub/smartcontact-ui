<div class="identity-fields grid" [class.grid--3]="!apilada()" [class.identity-fields--apilada]="apilada()">
  <div class="field">
    <sc-inputtext
      [label]="'groups.form.fields.name' | translate"
      [inputId]="idPrefix() + '-name'"
      autocomplete="off"
      [required]="true"
      [value]="name()"
      [helperText]="nameHint()"
      [error]="nameError() ? (nameError()! | translate) : undefined"
      (valueChange)="nameChange.emit($event ?? '')"
      (focusout)="nameLeave.emit($event)"
      (keydown.enter)="enter.emit()"
    />
  </div>

  @if (hasPhone()) {
    <div class="field">
      <!-- Obligatorio con Teléfono y de los números asignados, como en la ficha (DD-142). -->
      <sc-select
        [label]="'groups.form.fields.phone' | translate"
        [inputId]="idPrefix() + '-phone'"
        required
        [options]="phoneOptions()"
        [value]="phone() || null"
        [placeholder]="'groups.form.fields.phone_placeholder' | translate"
        [helperText]="'groups.form.fields.phone_hint' | translate"
        [error]="phoneError() ? (phoneError()! | translate) : undefined"
        (valueChange)="onPhone($event)"
      />
    </div>
  }

  <div class="field">
    <!-- `for` no nombra un `span[role=combobox]`: sin `ariaLabelledBy`, el lector leía el valor («Baja») como nombre del
         campo. La ayuda sale del manual de usuario de Voice (DD-133). -->
    <sc-select
      [label]="'groups.form.fields.priority' | translate"
      [inputId]="idPrefix() + '-priority'"
      [options]="priorities"
      [value]="priority()"
      [helperText]="'groups.form.fields.priority_hint' | translate"
      (valueChange)="onPriority($event)"
    >
      <ng-template #item let-p>{{ priorityKeys[p] | translate }}</ng-template>
      <ng-template #selectedItem let-p>{{ priorityKeys[p] | translate }}</ng-template>
    </sc-select>
  </div>
</div>
