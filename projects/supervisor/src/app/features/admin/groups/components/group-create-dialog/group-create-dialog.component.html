<sc-dialog
  [visible]="visible()"
  [title]="(source() ? 'groups.form.duplicate_title' : 'groups.form.create_title') | translate"
  [subtitle]="
    source()
      ? ('groups.create_dialog.duplicate_subtitle' | translate: { source: source()!.name })
      : ('groups.create_dialog.subtitle' | translate)
  "
  (shown)="onShown()"
  (cancelled)="cancelled.emit()"
>
  <!-- La misma pieza que la pestaña Identidad: lo que se rellena aquí es lo que dice la cabecera de
       la ficha, y lo que se cambia después en Identidad. Enter en el nombre crea el grupo. -->
  <sc-group-identity-fields
    idPrefix="group-create"
    [name]="name()"
    [phone]="phone()"
    [priority]="priority()"
    [hasPhone]="hasPhone()"
    [phoneOptions]="phoneOptions()"
    [nameError]="nameError()"
    (nameChange)="name.set($event)"
    (phoneChange)="phone.set($event)"
    (priorityChange)="priority.set($event)"
    (enter)="submit()"
  />

  <div modal-actions>
    <sc-button size="sm" variant="secondary" appearance="outlined" [label]="'common.cancel' | translate" (clicked)="cancelled.emit()" />
    <sc-button size="sm" variant="primary" [label]="(source() ? 'common.duplicate' : 'common.create') | translate" (clicked)="submit()" />
  </div>
</sc-dialog>
