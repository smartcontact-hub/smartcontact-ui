<!-- Modelo "todo arriba" (experiment S59): sin banda de page-header. La
     identidad la da el breadcrumb de la TopBar; el CTA (y su panel de creación
     inline) se proyectan a la barra vía TopBarSlotService. El panel sigue
     anclado al botón (position relative en .page__create-anchor). -->
<ng-template #topbarActions>
  <div
    class="page__create-anchor"
    (scClickOutside)="closeCreatePanel()"
    [scClickOutsideEnabled]="creating()"
  >
    <sc-button class="top-bar__cta" size="sm" type="button" variant="primary" (clicked)="onCreateClick()">
      <sc-icon [name]="plusIcon" size="inherit" />
      <span>{{ 'labels.create_button' | translate }}</span>
    </sc-button>

    @if (creating()) {
      <div class="page__panel-anchor">
        <sc-label-form-panel
          [existingNames]="existingNames()"
          (save)="onCreateSubmit($event)"
          (cancelled)="closeCreatePanel()"
        />
      </div>
    }
  </div>
</ng-template>

<!-- La lista (título, barra, tabla, selección, menú de fila) la monta `sc-list-page` (DD-97). Aquí solo lo
     que es de Etiquetas: columnas y celdas, el panel de edición, acciones y diálogos. -->
<sc-list-page
  [heading]="'labels.breadcrumb' | translate"
  [rows]="sorted()"
  [columns]="columns()"
  [searchPlaceholder]="'common.search' | translate"
  [searchFn]="matchesSearch"
  [(query)]="searchQuery"
  exportable
  [rowMenu]="rowMenu"
  selectable
  [bulkEntity]="bulkEntity()"
  [(selectedIds)]="selectedIds"
  noResultsKey="labels.no_results.text"
  tableTestId="labels-table"
  (exportRequest)="onExport($event)"
>
  <sc-empty-state
    scListEmpty
    [icon]="tagIcon"
    titleKey="labels.empty.title"
    bodyKey="labels.empty.text"
    ctaKey="labels.empty.cta"
    (cta)="creating.set(true)"
  />

  <ng-container ngProjectAs="[scListBulkActions]">
    <sc-button type="button" variant="danger" (clicked)="requestDeleteSelection()">
      <span>{{ 'common.delete' | translate }}</span>
    </sc-button>
  </ng-container>
</sc-list-page>

<!-- Celdas de la tabla. Viven FUERA de la lista para que los
     `viewChild` las resuelvan; `columns()` las recoge. El contexto es
     `{ $implicit: label }`. -->
<ng-template #nameTpl let-label>
  <sc-label-chip [label]="label" />

  <!-- El panel de edición sigue anclado a su fila: `--row` posiciona
       respecto a la celda, que es `position: relative`. -->
  @if (editingId() === label.id) {
    <div
      class="page__panel-anchor page__panel-anchor--row"
      (scClickOutside)="closeEditPanel()"
      [scClickOutsideEnabled]="editingId() === label.id"
    >
      <sc-label-form-panel
        [initial]="label"
        [existingNames]="existingNames()"
        (save)="onEditSubmit(label.id, $event)"
        (cancelled)="closeEditPanel()"
      />
    </div>
  }
</ng-template>

<ng-template #descTpl let-label>
  @if (label.description) {
    <span class="table__td-desc sc-text-body-regular">{{ label.description }}</span>
  } @else {
    <span class="table__td-desc table__td-desc--empty sc-text-body-regular">
      {{ 'labels.no_description' | translate }}
    </span>
  }
</ng-template>

<sc-delete-labels-dialog
  [labels]="deleteTarget() ?? []"
  [visible]="!!deleteTarget()"
  [agentCountByLabel]="agentCountByLabel()"
  (confirm)="confirmDelete()"
  (cancelled)="cancelDelete()"
/>
