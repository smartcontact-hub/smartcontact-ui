<div
  class="panel"
  [class.panel--flush]="flush()"
  [attr.role]="flush() ? null : 'dialog'"
  [attr.aria-label]="flush() ? null : ((initial() ? 'labels.form.edit_title' : 'labels.form.create_title') | translate)"
>
  @if (!flush()) {
    <h3 class="panel__title sc-text-body-semibold">
      {{ (initial() ? 'labels.form.edit_title' : 'labels.form.create_title') | translate }}
    </h3>
  }

  <div class="panel__field">
    <sc-inputtext
      #nameInput
      inputId="label-name"
      type="text"
      [label]="'labels.form.name' | translate"
      [value]="name()"
      [placeholder]="'labels.form.name_placeholder' | translate"
      (valueChange)="onNameInput($event)"
      (keydown)="onKey($event)"
    />
    <div class="panel__error-slot">
      @if (error()) {
        <div class="panel__error sc-text-caption-regular">
          <sc-icon [name]="alertIcon" size="inherit" />
          <span>{{ error() | translate }}</span>
        </div>
      }
    </div>
  </div>

  <div class="panel__field">
    <span class="panel__label sc-text-caption-semibold">{{ 'labels.form.color' | translate }}</span>
    <sc-color-dot-picker [options]="colorOptions()" [(value)]="color" />
  </div>

  <div class="panel__field">
    <label class="panel__label sc-text-caption-semibold" for="label-desc">
      {{ 'labels.form.description' | translate }}
      <span class="panel__hint">({{ 'common.optional' | translate }})</span>
    </label>
    <sc-inputtext
      inputId="label-desc"
      type="text"
      [value]="description()"
      [placeholder]="'labels.form.description_placeholder' | translate"
      (valueChange)="description.set($event)"
      (keydown)="onKey($event)"
    />
  </div>

  <div class="panel__actions">
    <sc-button size="sm" variant="secondary" appearance="outlined" [label]="'common.cancel' | translate" (clicked)="cancelled.emit()" />
    <sc-button size="sm" variant="primary" [label]="(initial() ? 'common.save' : 'common.create') | translate" (clicked)="onSave()" />
  </div>
</div>
