<!-- Modelo "todo arriba" (experiment S59): sin banda de page-header. La
     identidad la da el breadcrumb de la TopBar; el CTA se proyecta a la barra
     vía TopBarSlotService (ver topbarActions en el .ts). -->
<ng-template #topbarActions>
  <sc-button class="top-bar__cta" size="sm" type="button" variant="primary" (clicked)="onCreateClick()">
    <sc-icon [name]="plusIcon" size="inherit" />
    <span>{{ 'users.create_button' | translate }}</span>
  </sc-button>
</ng-template>

<!-- La lista (título, barra, tabla, selección, menú de fila) la monta `sc-list-page` (DD-97). Aquí solo lo
     que es de Usuarios: columnas y celdas, acciones y diálogos. -->
<sc-list-page
  [heading]="'sidebar.users' | translate"
  [rows]="users()"
  [columns]="columns()"
  [columnChoices]="columnDefs()"
  [columnStorageKey]="columnPrefKey"
  [searchPlaceholder]="'users.search_placeholder' | translate"
  [searchFn]="matchesSearch"
  [noResultsText]="'users.no_results' | translate"
  exportable
  [rowMenu]="rowMenu"
  [rowOpenable]="isOpenable"
  selectable
  [bulkEntity]="bulkEntity()"
  [(selectedIds)]="selectedIds"
  tableTestId="users-table"
  (rowOpen)="onRowOpen($event)"
  (exportRequest)="onExport($event)"
>
  <sc-empty-state
    scListEmpty
    [icon]="emptyIcon"
    titleKey="users.empty.title"
    bodyKey="users.empty.body"
    ctaKey="users.create_button"
    (cta)="onCreateClick()"
  />

  <ng-container ngProjectAs="[scListBulkActions]">
    <sc-bulk-edit-menu [fields]="bulkEditFields()" [buttonLabel]="'Editar'" (commit)="onBulkEditCommit($event)" />
    <sc-button type="button" variant="danger" (clicked)="requestDeleteSelection()">
      <span>{{ 'common.delete' | translate }}</span>
    </sc-button>
  </ng-container>
</sc-list-page>

<!-- Celdas de la tabla. Viven FUERA de la lista para que los `viewChild` las resuelvan; `columns()` las
     recoge. El contexto es `{ $implicit: user }`. -->
<ng-template #nameTpl let-user>
  <div class="table__td-name sc-text-body-semibold">
    @if (renamingId() === user.id) {
      <sc-inline-rename-cell
        [initialValue]="user.name"
        [placeholder]="'users.rename_placeholder' | translate"
        [ariaLabel]="'users.rename_aria' | translate: { name: user.name }"
        (commit)="onRenameCommit(user.id, $event)"
        (cancelled)="onRenameCancel(user.id)"
      />
    } @else {
      <span>{{ user.name }}</span>
    }
  </div>
</ng-template>

<!-- Texto plano, pero con `<span>` propio: el `<td>` lo pinta el DS y una
     regla encapsulada de esta página no lo alcanzaría (trampa 3 de la receta). -->
<ng-template #emailTpl let-user>
  <span class="table__td-text sc-text-body-regular" [title]="user.email">{{ user.email }}</span>
</ng-template>

<ng-template #identifierTpl let-user>
  <span class="table__td-text sc-text-body-regular">{{ user.identifier || '—' }}</span>
</ng-template>

<ng-template #typeTpl let-user>
  <sc-tag severity="secondary" [value]="typeLabel(user.type)" />
</ng-template>

<ng-template #statusTpl let-user>
  <sc-tag
    [severity]="user.status === 'active' ? 'success' : 'secondary'"
    [value]="'users.status.' + user.status | translate"
  />
</ng-template>

<sc-delete-entity-dialog
  [visible]="!!deleteTarget()"
  [mode]="(deleteTarget()?.length ?? 0) === 1 ? 'single' : 'bulk'"
  [items]="deleteItems()"
  [entitySingular]="'users.entity_singular' | translate"
  [entityPlural]="'users.entity_plural' | translate"
  (cancelled)="cancelDelete()"
  (confirm)="confirmDelete($event)"
/>

<!-- Antes de aplicar, se enseña A QUIÉN afecta y qué se le va a poner. En un
     cambio masivo la pregunta del usuario no es "¿seguro?" sino "¿seguro sobre
     ESTOS?", y la lista contesta eso. Mismo diálogo que agentes y grupos. -->
<sc-impact-preview-dialog
  [visible]="!!pendingBulkEdit()"
  [mode]="'bulkEdit'"
  [title]="'users.bulk_edit_title' | translate: { count: selectedIds().size }"
  [items]="impactItems()"
  [badge]="impactBadge()"
  (cancelled)="onBulkPreviewCancel()"
  (confirm)="onBulkPreviewConfirm($event)"
/>
