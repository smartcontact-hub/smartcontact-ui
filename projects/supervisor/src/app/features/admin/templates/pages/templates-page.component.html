<!-- Modelo "todo arriba" (experiment S59): sin banda de page-header. La identidad la da el breadcrumb de la TopBar; el CTA se
     proyecta a la barra vía TopBarSlotService y lleva al editor de la plantilla. -->
<ng-template #topbarActions>
  <sc-button class="top-bar__cta" type="button" variant="primary" (clicked)="onCreateClick()">
    <sc-icon [name]="plusIcon" size="inherit" />
    <span>{{ 'templates.create_button' | translate }}</span>
  </sc-button>
</ng-template>

<!-- La lista (título, barra, tabla, selección, menú de fila) la monta `sc-list-page` (DD-97). Aquí solo lo que es de
     Plantillas: las pestañas, columnas y celdas, acciones y diálogos. La fila abre su editor, en su propia página. -->
<sc-list-page
  [heading]="'templates.breadcrumb' | translate"
  [rows]="rows()"
  [empty]="templates().length === 0"
  [columns]="columns()"
  [columnChoices]="columnDefs()"
  [columnStorageKey]="columnPrefKey"
  [searchPlaceholder]="'templates.search_placeholder' | translate"
  [searchFn]="matchesSearch"
  [sortFn]="sortFn"
  [(query)]="searchQuery"
  [rowMenu]="rowMenu"
  [selectionMenu]="selectionMenu"
  rowOpenable
  (rowOpen)="onRowOpen($event)"
  exportable
  importable
  (exportRequest)="onExport($event)"
  (importRequest)="abrirImportar()"
  selectable
  [rowLabel]="rowLabel"
  [(selectedIds)]="selectedIds"
  [noResultsKey]="searchQuery() ? 'templates.no_results.text_with_query' : 'templates.no_results.text'"
  tableTestId="templates-table"
>
  <sc-empty-state
    scListEmpty
    [icon]="fileStackIcon"
    titleKey="templates.empty.title"
    bodyKey="templates.empty.text"
    ctaKey="templates.create_button"
    (cta)="onCreateClick()"
  />

</sc-list-page>

<!-- Celdas de la tabla. Fuera de la lista para que los `viewChild`
     las resuelvan; `columns()` las recoge. Contexto `{ $implicit: tpl }`. -->
<ng-template #titleTpl let-tpl>
  <!-- Si el título no cabe, se corta con «…» y se lee entero al pasar el ratón (COA SISMAC-4438). -->
  <span class="table__title-text sc-text-body-semibold" [pTooltip]="tpl.title" showOnEllipsis tooltipPosition="top">{{ tpl.title }}</span>
</ng-template>

<ng-template #typeTpl let-tpl>
  <span class="sc-text-body-regular">{{ canal(tpl) }}</span>
</ng-template>

<ng-template #bodyTpl let-tpl>
  <span class="table__body-text sc-text-body-regular" [pTooltip]="plainBody(tpl)" showOnEllipsis tooltipPosition="top">{{ plainBody(tpl) }}</span>
</ng-template>

<ng-template #agentsTpl let-tpl>
  @if (agentCount(tpl); as n) {
    <span class="sc-text-body-regular">{{ n }}</span>
  } @else {
    <sc-celda-vacia />
  }
</ng-template>

<ng-template #updatedTpl let-tpl>
  <span class="table__updated-text sc-text-caption-regular">{{ fecha(tpl) }}</span>
</ng-template>

<!-- Importar plantillas de un CSV: la plantilla, el archivo y, antes de crear nada, qué entra y qué no. -->
@if (importOpen()) {
  <sc-import-dialog
    [title]="'templates.import.title' | translate"
    [summary]="importResumen()"
    (templateRequest)="descargarPlantilla()"
    (fileSelected)="onImportFile($event)"
    (confirmed)="confirmarImportar()"
    (cancelled)="cerrarImportar()"
  />
}
