<!-- Modelo "todo arriba" (experiment S59): sin banda de page-header. La
     identidad la da el breadcrumb de la TopBar; el CTA (y su panel de creación
     inline) se proyectan a la barra vía TopBarSlotService. -->
<ng-template #topbarActions>
  <div
    class="page__create-anchor"
    (scClickOutside)="closeCreatePanel()"
    [scClickOutsideEnabled]="creating()"
  >
    <sc-button class="top-bar__cta" size="sm" type="button" variant="primary" (clicked)="onCreateClick()">
      <sc-icon [name]="plusIcon" size="inherit" />
      <span>{{ 'templates.create_button' | translate }}</span>
    </sc-button>

    @if (creating()) {
      <div class="page__panel-anchor">
        <sc-template-form-panel
          [defaultType]="activeTab()"
          [existingTitles]="existingTitles()"
          (save)="onCreateSubmit($event)"
          (cancelled)="closeCreatePanel()"
        />
      </div>
    }
  </div>
</ng-template>

<!-- La lista (título, barra, tabla, selección, menú de fila) la monta `sc-list-page` (DD-97). Aquí solo lo
     que es de Plantillas: las pestañas, columnas y celdas, el panel de edición, acciones y diálogos. -->
<sc-list-page
  [heading]="'templates.breadcrumb' | translate"
  [rows]="tabRows()"
  [empty]="templates().length === 0"
  [columns]="columns()"
  [searchPlaceholder]="'common.search' | translate"
  [searchFn]="matchesSearch"
  [(query)]="searchQuery"
  [rowMenu]="rowMenu"
  selectable
  [bulkEntity]="bulkEntity()"
  [rowLabel]="rowLabel"
  [(selectedIds)]="selectedIds"
  [noResultsKey]="searchQuery() ? 'templates.no_results.text_with_query' : 'templates.no_results.text'"
  [noResultsParams]="{ tab: ('templates.type.' + activeTab()) | translate }"
  tableTestId="templates-table"
>
  <div scListBeforeToolbar class="tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="tabs__tab sc-text-body-regular"
      [class.tabs__tab--active]="activeTab() === 'chat'"
      [attr.aria-selected]="activeTab() === 'chat'"
      (click)="switchTab('chat')"
    >
      <sc-icon [name]="chatIcon" size="inherit" />
      <span>{{ 'templates.type.chat' | translate }}</span>
      <span class="tabs__count">{{ chatCount() }}</span>
    </button>
    <button
      type="button"
      role="tab"
      class="tabs__tab sc-text-body-regular"
      [class.tabs__tab--active]="activeTab() === 'email'"
      [attr.aria-selected]="activeTab() === 'email'"
      (click)="switchTab('email')"
    >
      <sc-icon [name]="emailIcon" size="inherit" />
      <span>{{ 'templates.type.email' | translate }}</span>
      <span class="tabs__count">{{ emailCount() }}</span>
    </button>
  </div>

  <sc-empty-state
    scListEmpty
    [icon]="fileStackIcon"
    titleKey="templates.empty.title"
    bodyKey="templates.empty.text"
    ctaKey="templates.empty.cta"
    (cta)="creating.set(true)"
  />

  <ng-container ngProjectAs="[scListBulkActions]">
    <sc-button type="button" variant="danger" (clicked)="requestDeleteSelection()">
      <span>{{ 'common.delete' | translate }}</span>
    </sc-button>
  </ng-container>
</sc-list-page>

<!-- Celdas de la tabla. Fuera de la lista para que los `viewChild`
     las resuelvan; `columns()` las recoge. Contexto `{ $implicit: tpl }`. -->
<ng-template #titleTpl let-tpl>
  <span class="table__title-text sc-text-body-semibold">{{ tpl.title }}</span>

  @if (editingId() === tpl.id) {
    <div
      class="page__panel-anchor page__panel-anchor--row"
      (scClickOutside)="closeEditPanel()"
      [scClickOutsideEnabled]="editingId() === tpl.id"
    >
      <sc-template-form-panel
        [initial]="tpl"
        [defaultType]="activeTab()"
        [existingTitles]="existingTitles()"
        (save)="onEditSubmit(tpl.id, $event)"
        (cancelled)="closeEditPanel()"
      />
    </div>
  }
</ng-template>

<ng-template #bodyTpl let-tpl>
  <span class="table__body-text sc-text-body-regular">{{ tpl.body }}</span>
</ng-template>

<ng-template #updatedTpl let-tpl>
  <span class="table__updated-text sc-text-caption-regular">{{ tpl.updatedAt }}</span>
</ng-template>

<sc-delete-entity-dialog
  [visible]="!!deleteTarget()"
  [mode]="(deleteTarget()?.length ?? 0) === 1 ? 'single' : 'bulk'"
  [items]="deleteItems()"
  [entitySingular]="'templates.entity.singular' | translate"
  [entityPlural]="'templates.entity.plural' | translate"
  [singleDetailMessage]="'templates.delete.single_detail' | translate"
  [bulkFooterMessage]="'templates.delete.bulk_footer' | translate"
  (cancelled)="cancelDelete()"
  (confirm)="confirmDelete($event)"
/>
