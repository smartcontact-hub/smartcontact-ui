<ng-template #topbarActions>
  @if (dirty()) {
    <sc-button
      size="sm"
      variant="secondary"
      appearance="outlined"
      [label]="'common.undo' | translate"
      (clicked)="cancel()"
    />
  }
  <sc-button
    size="sm"
    variant="primary"
    [disabled]="!canSave()"
    [loading]="saving()"
    [label]="'common.save' | translate"
    (clicked)="save()"
  />
</ng-template>

<div class="page">
  <div class="page__inner">
    <!-- El título de la página vive en el CUERPO, no en la barra: la miga de
         arriba dice DÓNDE estás y esta línea dice QUÉ miras (modelo Snow UI,
         medido en `/orders`). Es el MISMO `<h1>` que S59 dejó oculto —no hay un
         encabezado nuevo—, así que sigue habiendo exactamente uno por documento. -->
    <sc-section-card
      icon="groups"
      [headingLevel]="1"
      surface="card"
      titleKey="config.aed.subpages.grupos.heading"
    >
      <!--
        LISTA DE AJUSTES: nombre a la IZQUIERDA, control a la DERECHA, una fila por ajuste.

        Es la fórmula de las pantallas de ajustes que se sienten cuidadas (Linear, Vercel,
        GitHub, los Ajustes de macOS) para un caso exacto como este: muchos parámetros
        SUELTOS, de tipos distintos, sin relación de formulario entre ellos. Resuelve de una
        vez lo que las dos versiones anteriores no:

          · Los nombres forman UNA columna y se leen de arriba abajo sin saltar de columna.
          · Los controles forman UN borde derecho, y cada uno mide lo que pide su contenido:
            un número no ocupa media pantalla ni una fila de tres huecos desiguales.
          · Todo va en una sola rejilla: antes se apilaban dos (desplegables en 2 columnas y
            números en 3) y sus verticales no casaban.

        Con nombre a un lado y control al otro, la vista cruza la fila entera, así que aquí SÍ
        van rayas entre filas: es la regla de la tabla («la línea está donde hay columnas que
        cruzar»), no una excepción a la de la lista de estados de General.
      -->
      <section class="sub-section" aria-labelledby="grupos-params-title">
        <header class="sub-section__head">
          <h2 id="grupos-params-title" class="sub-section__title sc-text-body-semibold">
            {{ 'config.aed.subpages.grupos.params.title' | translate }}
          </h2>
        </header>

        <div class="settings-list">
          <div class="setting-row">
            <label class="setting-row__label sc-text-body-regular" id="grupos-estrategia-label" for="grupos-estrategia">
              {{ 'config.aed.subpages.grupos.params.estrategia' | translate }}
            </label>
            <sc-multiselect
              class="setting-row__control setting-row__control--select"
              inputId="grupos-estrategia"
              ariaLabelledBy="grupos-estrategia-label"
              [options]="estrategiaOptions"
              [value]="form().estrategia"
              [placeholder]="'config.aed.subpages.grupos.params.placeholder' | translate"
              (valueChange)="onMulti('estrategia', $event)"
            />
          </div>
          <div class="setting-row">
            <label class="setting-row__label sc-text-body-regular" id="grupos-prioridad-label" for="grupos-prioridad">
              {{ 'config.aed.subpages.grupos.params.prioridad' | translate }}
            </label>
            <sc-multiselect
              class="setting-row__control setting-row__control--select"
              inputId="grupos-prioridad"
              ariaLabelledBy="grupos-prioridad-label"
              [options]="prioridadOptions"
              [value]="form().prioridad"
              [placeholder]="'config.aed.subpages.grupos.params.placeholder' | translate"
              (valueChange)="onMulti('prioridad', $event)"
            />
          </div>
          <div class="setting-row">
            <label class="setting-row__label sc-text-body-regular" id="grupos-tipo-cola-label" for="grupos-tipo-cola">
              {{ 'config.aed.subpages.grupos.params.tipo_cola' | translate }}
            </label>
            <sc-multiselect
              class="setting-row__control setting-row__control--select"
              inputId="grupos-tipo-cola"
              ariaLabelledBy="grupos-tipo-cola-label"
              [options]="tipoColaOptions"
              [value]="form().tipoColaEspera"
              [placeholder]="'config.aed.subpages.grupos.params.placeholder' | translate"
              (valueChange)="onMulti('tipoColaEspera', $event)"
            />
          </div>
          <div class="setting-row">
            <label class="setting-row__label sc-text-body-regular" for="grupos-capacidad-cola">
              {{ 'config.aed.subpages.grupos.params.capacidad_cola' | translate }}
            </label>
            <sc-inputnumber
              class="setting-row__control setting-row__control--number"
              inputId="grupos-capacidad-cola"
              [min]="0"
              [value]="form().capacidadColaEspera"
              (valueChange)="onNumber('capacidadColaEspera', $event)"
            />
          </div>
          <div class="setting-row">
            <label class="setting-row__label sc-text-body-regular" for="grupos-tiempo-max">
              {{ 'config.aed.subpages.grupos.params.tiempo_max' | translate }}
            </label>
            <sc-inputnumber
              class="setting-row__control setting-row__control--number"
              inputId="grupos-tiempo-max"
              [suffix]="'config.aed.subpages.grupos.params.segundos' | translate"
              [min]="0"
              [value]="form().tiempoMaxEspera"
              (valueChange)="onNumber('tiempoMaxEspera', $event)"
            />
          </div>
          <div class="setting-row">
            <label class="setting-row__label sc-text-body-regular" for="grupos-tiempo-transfer">
              {{ 'config.aed.subpages.grupos.params.tiempo_transfer' | translate }}
            </label>
            <sc-inputnumber
              class="setting-row__control setting-row__control--number"
              inputId="grupos-tiempo-transfer"
              [suffix]="'config.aed.subpages.grupos.params.segundos' | translate"
              [min]="0"
              [value]="form().tiempoTransferencia"
              (valueChange)="onNumber('tiempoTransferencia', $event)"
            />
          </div>
          <div class="setting-row">
            <label class="setting-row__label sc-text-body-regular" id="grupos-voz-label" for="grupos-voz">
              {{ 'config.aed.subpages.grupos.params.voz' | translate }}
            </label>
            <sc-multiselect
              class="setting-row__control setting-row__control--select"
              inputId="grupos-voz"
              ariaLabelledBy="grupos-voz-label"
              [options]="vozOptions"
              [value]="form().voz"
              [placeholder]="'config.aed.subpages.grupos.params.placeholder' | translate"
              (valueChange)="onMulti('voz', $event)"
            />
          </div>
          <!-- El interruptor va a la DERECHA porque aquí manda el patrón LISTA DE AJUSTES:
               todos los controles comparten borde derecho y uno a la izquierda sería el
               único fuera de sitio. En General y Agentes va a la IZQUIERDA porque allí manda
               el patrón FILA DE FRASE: el mando abre la frase que gobierna y detrás vienen
               más cosas (número, sufijo, descripción). La regla es una sola: el interruptor
               va donde van los controles de SU patrón, y nunca se mezclan los dos patrones
               en la misma sección. Decidido con Rafa el 2026-09-13. -->
          <div class="setting-row">
            <label class="setting-row__label sc-text-body-regular" for="grupos-desbordar">
              {{ 'config.aed.subpages.grupos.params.desbordar' | translate }}
            </label>
            <sc-toggleswitch
              class="setting-row__control"
              inputId="grupos-desbordar"
              [checked]="form().desbordar"
              (checkedChange)="update('desbordar', $event)"
            />
          </div>
        </div>
      </section>

      <sc-divider />

      <section class="sub-section" aria-labelledby="grupos-apertura-title">
        <header class="sub-section__head">
          <h2 id="grupos-apertura-title" class="sub-section__title sc-text-body-semibold">
            {{ 'config.aed.subpages.grupos.apertura.title' | translate }}
          </h2>
        </header>

        <div class="settings-list">
          <div class="setting-row">
            <label class="setting-row__label sc-text-body-regular" id="grupos-apertura-tipo-label" for="grupos-apertura-tipo">
              {{ 'config.aed.subpages.grupos.apertura.tipo_label' | translate }}
            </label>
            <sc-select
              class="setting-row__control setting-row__control--select"
              inputId="grupos-apertura-tipo"
              ariaLabelledBy="grupos-apertura-tipo-label"
              [options]="aperturaOptions"
              [value]="form().aperturaTipo"
              [placeholder]="'config.aed.subpages.grupos.params.placeholder' | translate"
              (valueChange)="onSelect('aperturaTipo', $event)"
            />
          </div>
          <div class="setting-row">
            <label class="setting-row__label sc-text-body-regular" for="grupos-apertura-tamano">
              {{ 'config.aed.subpages.grupos.apertura.tamano_label' | translate }}
            </label>
            <sc-inputnumber
              class="setting-row__control setting-row__control--number"
              inputId="grupos-apertura-tamano"
              [suffix]="'config.aed.subpages.grupos.apertura.tamano_suffix' | translate"
              [min]="0"
              [value]="form().aperturaTamano"
              (valueChange)="onNumber('aperturaTamano', $event)"
            />
          </div>
        </div>
      </section>
    </sc-section-card>
  </div>
</div>
