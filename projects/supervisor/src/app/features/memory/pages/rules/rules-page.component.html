<!-- Modelo "todo arriba" (experiment S59): sin banda de page-header. La
     identidad la da el breadcrumb de la TopBar; el CTA (y su menú popup
     "nueva regla") se proyectan a la barra vía TopBarSlotService. El p-menu
     hace appendTo="body" y se ancla al botón vía toggle($event). -->
<ng-template #topbarActions>
  <sc-button class="top-bar__cta" size="sm" type="button" variant="primary" (clicked)="newRuleMenu.toggle($event)">
    <sc-icon [name]="plusIcon" size="inherit" />
    <span>{{ 'memory.rules.new_rule' | translate }}</span>
  </sc-button>
</ng-template>

<!-- Menú "nueva regla" compartido: lo abren el CTA de la TopBar y el del empty
     state (mismo modelo, elección de tipo en ambos). appendTo="body" → da igual
     dónde viva en el DOM; se ancla al botón que le pasa su $event. -->
<p-menu
  #newRuleMenu
  [model]="newRuleMenuItems"
  [popup]="true"
  appendTo="body"
  styleClass="rules-new-menu"
/>

<!-- La lista (título, tabla, menú de fila) la monta `sc-list-page` (DD-97). Aquí solo lo que es de Reglas: el
     aviso sin reglas activas, columnas y celdas, y las acciones. -->
<sc-list-page
  [heading]="'memory.rules.page_title' | translate"
  [rows]="allRules()"
  [empty]="isEmpty()"
  [columns]="columns()"
  [rowMenu]="rowMenu"
  rowOpenable
  tableTestId="rules-table"
  (rowOpen)="openRule($event)"
>
  <sc-empty-state
    scListEmpty
    [icon]="emptyIcon"
    titleKey="memory.rules.empty_title"
    bodyKey="memory.rules.empty_desc"
    ctaKey="memory.rules.empty_cta"
    (cta)="newRuleMenu.toggle($event)"
  />

  <!-- Aviso no bloqueante (DD-30 permite 0 activas): sin ninguna regla activa las conversaciones nuevas no se
       transcriben ni clasifican solas. -->
  <ng-container ngProjectAs="[scListBeforeToolbar]">
    @if (!isEmpty() && !hasActive()) {
      <sc-message class="rules-no-active" severity="info" [text]="'memory.rules.no_active_banner' | translate" />
    }
  </ng-container>
</sc-list-page>

<!-- Celdas de la tabla. Viven FUERA de la lista para que los
     `viewChild` las resuelvan; `columns()` las recoge. El contexto es
     `{ $implicit: rule }`.

     Todas envuelven su contenido en un elemento con clase propia: el `<td>` lo
     pinta ahora el DS, así que una regla encapsulada de esta página que
     apuntara a `.rules-table__td-*` ya no lo alcanzaría. -->
<ng-template #nameTpl let-rule>
  <!-- Enlace REAL: la fila sigue siendo clicable con ratón (y ahora también
       enfocable, ver `rowsFocusable`), pero cmd+click / abrir en pestaña nueva
       viven aquí. `stopPropagation` evita que el click navegue dos veces. -->
  <a
    class="rules-table__name sc-text-body-semibold"
    [routerLink]="['/conversaciones/reglas', rule.id]"
    (click)="$event.stopPropagation()"
    >{{ rule.name }}</a
  >
</ng-template>

<ng-template #scopeTpl let-rule>
  <span class="rules-cell rules-cell--scope sc-text-body-regular" [attr.title]="scopeSummary(rule)">
    {{ scopeSummary(rule) }}
  </span>
</ng-template>

<ng-template #actionsTpl let-rule>
  <span class="rules-actions-chips">
    <!-- Tags del DS con solo icono (DD-76); el nombre accesible va en el host. -->
    @if (rule.transcripcion) {
      <sc-tag
        severity="secondary"
        [icon]="transcriptionIcon"
        role="img"
        [attr.title]="'memory.rules.chip.transcription' | translate"
        [attr.aria-label]="'memory.rules.chip.transcription' | translate"
      />
    }
    @if (rule.clasificacion) {
      <sc-tag
        severity="secondary"
        [icon]="sparklesIcon"
        role="img"
        [attr.title]="'memory.rules.chip.classification' | translate"
        [attr.aria-label]="'memory.rules.chip.classification' | translate"
      />
    }
  </span>
</ng-template>

<!-- `rules-status--*` en el host es solo el gancho de los tests: el aspecto es del DS. -->
<ng-template #statusTpl let-rule>
  @if (rule.active) {
    <sc-tag class="rules-status--active" severity="success" [value]="'memory.rules.status.active' | translate" />
  } @else {
    <sc-tag class="rules-status--inactive" severity="secondary" [value]="'memory.rules.status.inactive' | translate" />
  }
</ng-template>

<ng-template #modifiedTpl let-rule>
  <span class="rules-cell sc-text-body-regular">{{ formatRelativeDate(rule.lastModified) }}</span>
</ng-template>
