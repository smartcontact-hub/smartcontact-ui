<!-- Modelo "todo arriba" (experiment S59): sin banda de page-header. La
     identidad la da el breadcrumb de la TopBar; el CTA se proyecta a la barra
     vía TopBarSlotService (ver topbarActions en el .ts). -->
<ng-template #topbarActions>
  <sc-button class="top-bar__cta" size="sm" type="button" variant="primary" (clicked)="onNewCategory()">
    <sc-icon [name]="plusIcon" size="inherit" />
    <span>{{ 'memory.categories.new_category' | translate }}</span>
  </sc-button>
</ng-template>

<!-- La lista (título, tabla, menú de fila) la monta `sc-list-page` (DD-97). Aquí solo lo que es de Categorías:
     columnas y celdas, el formulario y las acciones. El botón del nombre sigue ahí: es el camino por teclado a la
     edición que comparten las hermanas de Memory. -->
<sc-list-page
  [heading]="'memory.categories.page_title' | translate"
  [rows]="categories()"
  [empty]="isEmpty()"
  [columns]="columns()"
  [rowMenu]="rowMenu"
  rowOpenable
  [rowClass]="rowClass"
  tableTestId="categories-table"
  (rowOpen)="openEditForm($event)"
>
  <sc-empty-state
    scListEmpty
    [icon]="tagsIcon"
    titleKey="memory.categories.empty_title"
    bodyKey="memory.categories.empty_desc"
    ctaKey="memory.categories.new_category"
    (cta)="onNewCategory()"
  />
</sc-list-page>

<!-- Celdas de la tabla. Viven FUERA de la lista para que los
     `viewChild` las resuelvan; `columns()` las recoge. El contexto es
     `{ $implicit: cat }`.

     Cada celda con estilo propio lleva su `<span>`: el `<td>` lo pinta ahora
     el DS y una regla encapsulada de esta página no lo alcanzaría; lo
     proyectado desde aquí sí conserva su `_ngcontent`. -->
<ng-template #nameTpl let-cat>
  <button
    type="button"
    class="categories-table__name"
    (click)="$event.stopPropagation(); openEditForm(cat)"
  >
    {{ cat.name }}
  </button>
  @if (cat.group) {
    <span class="categories-table__group sc-text-caption-regular">· {{ cat.group }}</span>
  }
</ng-template>

<ng-template #descTpl let-cat>
  <span class="categories-table__td-desc sc-text-body-regular" [attr.title]="cat.description">{{ cat.description }}</span>
</ng-template>

<ng-template #usedInTpl let-cat>
  @if (usedInRules(cat.id) > 0) {
    <span class="categories-num">{{ usedInRules(cat.id) }}</span>
  } @else {
    <span class="categories-num categories-num--empty">—</span>
  }
</ng-template>

<ng-template #classifiedTpl let-cat>
  <span class="categories-num">{{ cat.classifiedCalls }}</span>
</ng-template>

<!-- `rules-status--*` en el host es solo el gancho de los tests: el aspecto es del DS. -->
<ng-template #statusTpl let-cat>
  @if (cat.isActive) {
    <sc-tag class="rules-status--active" severity="success" [value]="'memory.categories.status.active' | translate" />
  } @else {
    <sc-tag class="rules-status--inactive" severity="secondary" [value]="'memory.categories.status.inactive' | translate" />
  }
</ng-template>

<ng-template #createdTpl let-cat>
  <span class="categories-table__td-date sc-text-caption-regular">{{ formatDate(cat.createdAt) }}</span>
</ng-template>

<sc-memory-category-form-modal
  [visible]="formOpen()"
  [category]="formCategory()"
  (closed)="onFormClose()"
  (saved)="onFormSaved($event)"
/>
