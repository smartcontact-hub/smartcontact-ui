<!-- El `sc-multiselect` del DS, el `p-multiselect` de primeng.dev (candidato 6 del barrido): flechas, Espacio,
     buscador, «marcar todo» y lector, que el desplegable hecho a mano no traía. Marcar todo es «cualquiera», también
     los que se añadan después. -->
<sc-multiselect
  class="vpick"
  display="chip"
  filter
  [filled]="true"
  [group]="grouped()"
  [ariaLabel]="'memory.rules.builder.cond.value_aria' | translate"
  [placeholder]="placeholder()"
  [options]="options()"
  optionLabel="label"
  optionValue="key"
  [maxSelectedLabels]="isAny() ? 0 : 3"
  [selectedItemsLabel]="isAny() ? anyLabel() : undefined"
  [value]="selectedKeys()"
  (valueChange)="onChange($event)"
>
  <ng-template #item let-o>
    <span class="vpick__opt" [class.vpick__opt--nested]="o.nested">
      @if (o.memberCount !== undefined) {
        <sc-icon class="vpick__opt-ic" name="groups" size="inherit" />
      }
      <span class="vpick__opt-main">{{ o.itemLabel }}</span>
      @if (o.memberCount !== undefined) {
        <span class="vpick__opt-sub sc-text-caption-regular">{{ 'memory.rules.builder.cond.enabled_members' | translate: { count: o.memberCount } }}</span>
      } @else if (o.sub) {
        <span class="vpick__opt-sub sc-text-caption-regular">{{ o.sub }}</span>
      }
    </span>
  </ng-template>
</sc-multiselect>
