<button
  type="button"
  class="mock-sample-switcher__trigger sc-text-caption-regular"
  (click)="menu.toggle($event)"
  [pTooltip]="'memory.mock_sample_switcher.trigger_title' | translate"
  tooltipPosition="top"
  tooltipEvent="both"
  [attr.aria-label]="'memory.mock_sample_switcher.trigger_aria' | translate"
  aria-haspopup="menu"
  [attr.aria-expanded]="menuOpen()"
  [attr.aria-controls]="menuId"
>
  <span class="mock-sample-switcher__chip sc-text-caption-semibold">{{
    'memory.mock_sample_switcher.chip_label' | translate
  }}</span>
  <sc-icon class="mock-sample-switcher__icon" [name]="databaseIcon" size="inherit" />
  <span class="mock-sample-switcher__label-prefix">{{
    'memory.mock_sample_switcher.data_prefix' | translate
  }}</span>
  <span class="mock-sample-switcher__current sc-text-caption-semibold">{{ currentSample().labelKey | translate }}</span>
</button>

<!-- `p-menu` emergente (candidato 28 del barrido de PrimeNG): flechas, Intro y Escape de serie, y el foco vuelve al
     botón. Cada opción pinta su título y su descripción con `#item`; el nombre que oye el lector es su `label`. -->
<p-menu
  #menu
  [id]="menuId"
  [model]="menuItems()"
  [popup]="true"
  appendTo="body"
  styleClass="mock-sample-switcher__popover"
  (onShow)="menuOpen.set(true)"
  (onHide)="menuOpen.set(false)"
>
  <!-- El enlace con `data-pc-section="itemlink"` es el que pulsa el Intro de p-menu: sin él, el teclado no elige. -->
  <ng-template #item let-item>
    <a class="p-menu-item-link mock-sample-switcher__item" data-pc-section="itemlink" tabindex="-1" [class.is-active]="item.activo">
      <div class="mock-sample-switcher__item-head">
        <span class="mock-sample-switcher__item-title sc-text-body-semibold">{{ item.titulo }}</span>
        @if (item.activo) {
          <sc-icon class="mock-sample-switcher__item-check" [name]="checkIcon" size="inherit" />
        }
      </div>
      <p class="mock-sample-switcher__item-desc">{{ item.descripcion }}</p>
    </a>
  </ng-template>
</p-menu>
