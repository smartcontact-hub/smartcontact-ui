<section class="multi-rec" [attr.aria-label]="'memory.player.multi.aria_player' | translate">
  <!-- Row 1 · transport + cumulative time of the active leg -->
  <div class="multi-rec__transport">
    <sc-button variant="secondary" appearance="text" rounded [icon]="back10Icon" [ariaLabel]="'memory.player.audio.back10' | translate" [disabled]="!playerEnabled()" (clicked)="onBack10()" />

    <sc-button variant="primary" rounded [icon]="isPlaying() ? pauseIcon : playIcon" [ariaLabel]="(isPlaying() ? 'memory.player.audio.pause' : 'memory.player.audio.play') | translate" [disabled]="!playerEnabled()" (clicked)="onTogglePlay()" />

    <sc-button variant="secondary" appearance="text" rounded [icon]="fwd10Icon" [ariaLabel]="'memory.player.audio.fwd10' | translate" [disabled]="!playerEnabled()" (clicked)="onFwd10()" />

    <span class="multi-rec__time tabular-nums">
      {{ currentTimeLabel() }} / {{ totalDurationLabel() }}
    </span>
  </div>

  <!-- Row 2 · la barra, partida en tramos por su duración. El tramo activo es el `p-slider` de primeng.dev tal cual
       (candidato 1 del barrido, como el reproductor de una grabación): flechas, Re Pág y Av Pág de 10 en 10 segundos,
       Inicio, Fin y arrastre. Antes era un botón con role="slider" que solo atendía al clic. Los demás tramos son su
       misma pista sin mando: de tramo se cambia en la fila de abajo. -->
  <div class="multi-rec__bar">
    @for (rec of recordings(); track rec.id; let idx = $index) {
      @if (idx === selectedIndex()) {
        <p-slider
          class="multi-rec__scrub"
          [style.flexGrow]="fractions()[idx]"
          [ngModel]="currentTime()"
          (ngModelChange)="onSeek($event)"
          [min]="0"
          [max]="totalDuration()"
          [step]="1"
          [disabled]="!playerEnabled()"
          [ariaLabel]="'memory.player.multi.aria_seek' | translate"
          [pt]="{ input: { 'aria-valuetext': currentTimeLabel() } }"
        />
      } @else {
        <span aria-hidden="true" class="multi-rec__seg" [style.flexGrow]="fractions()[idx]"></span>
      }
    }
  </div>

  <!-- Row 3 · labels alineadas con segmentos (radiogroup) -->
  <div
    class="multi-rec__labels"
    role="radiogroup"
    [attr.aria-label]="'memory.player.multi.aria_radiogroup' | translate"
  >
    @for (rec of recordings(); track rec.id; let idx = $index) {
      @let isActive = idx === selectedIndex();
      <button
        type="button"
        role="radio"
        class="multi-rec__label"
        [class.multi-rec__label--active]="isActive"
        [attr.aria-checked]="isActive"
        [attr.aria-label]="ariaLabel(rec, idx)"
        [attr.tabindex]="isActive ? 0 : -1"
        [attr.title]="labelText(rec, idx)"
        [style.flexGrow]="fractions()[idx]"
        [style.flexBasis.px]="0"
        (click)="onSelectRecording(rec.id)"
        (keydown)="onLabelKeydown($event, idx)"
      >
        <span class="multi-rec__label-name">{{ labelText(rec, idx) }}</span>
        <span class="multi-rec__label-meta tabular-nums">
          {{ rec.duration }}
          @if (rec.hasTranscription) {
            <sc-icon
              class="multi-rec__label-check"
              [name]="checkIcon"
              size="inherit"
              [attr.aria-label]="'memory.player.multi.leg_transcribed' | translate"
            />
          }
        </span>
      </button>
    }
  </div>
</section>
