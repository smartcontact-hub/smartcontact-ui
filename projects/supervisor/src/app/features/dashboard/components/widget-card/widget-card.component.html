<sc-panel fill [severity]="severity()">
  <!-- Cabecera propia: el título es un h2 de verdad y nombra la región del cuerpo (`titleId`). Es el asa
       para arrastrar el widget a otro hueco; el ⋮ va aparte, en las acciones, y sigue siendo un clic. -->
  <ng-template #header let-titleId>
    <div
      class="widget__head"
      [class.widget__head--draggable]="draggable()"
      [cdkDragHandleDisabled]="!draggable()"
      cdkDragHandle
    >
      <div class="widget__heading">
        <h2 class="widget__title sc-text-body-semibold" [id]="titleId" [pTooltip]="title()" showOnEllipsis tooltipPosition="top">{{ title() }}</h2>
        @if (entities().length) {
          <!-- Con «y N más», el tooltip nombra a los que no se ven, siempre; si salen todos, solo si se cortan. -->
          <span
            class="widget__entities sc-text-caption-regular"
            [pTooltip]="allEntities()"
            [showOnEllipsis]="!moreEntities()"
            tooltipPosition="top"
          >
            @if (moreEntities()) {
              {{ 'dashboard.widget.entities_more' | translate: { names: firstEntities(), count: moreEntities() } }}
            } @else {
              {{ firstEntities() }}
            }
          </span>
        }
      </div>
      @if (alert(); as a) {
        <!-- La etiqueta del DS. Dos: la frase y la cifra sola. En una tarjeta estrecha se ve la cifra
             y la frase queda para el lector de pantalla y en el tooltip de la cifra (sc-tag lleva un solo texto). -->
        <span class="widget__alert" role="status" animate.enter="widget__alert--in">
          <sc-tag
            class="widget__alert-long"
            rounded
            [severity]="a.level === 'danger' ? 'danger' : 'warn'"
            [icon]="a.level === 'danger' ? 'error' : 'warning'"
            [value]="a.reasonKey | translate: a.params"
          />
          <sc-tag
            class="widget__alert-short"
            rounded
            aria-hidden="true"
            [pTooltip]="a.reasonKey | translate: a.params"
            tooltipPosition="top"
            [severity]="a.level === 'danger' ? 'danger' : 'warn'"
            [icon]="a.level === 'danger' ? 'error' : 'warning'"
            [value]="a.shortKey | translate: a.params"
          />
        </span>
      }
      @if (filterLabel(); as label) {
        <sc-chip
          class="widget__filtered"
          removable
          [label]="label"
          [removeAriaLabel]="'dashboard.widget.clear_filter' | translate"
          (removed)="clearFilter()"
        />
      }
    </div>
  </ng-template>

  <!-- Sin `@if` alrededor de la plantilla: sc-panel la busca entre sus hijos directos. La acción de un widget
       (`[scWidgetAction]`, la pone la página) va a la izquierda del ⋮; en fila, porque `p-panel` no da forma a su
       caja de acciones y el ⋮ es flex: sin la fila, bajaría de línea. -->
  <ng-template #icons>
    @if (!preview()) {
      <div class="widget__actions">
        <ng-content select="[scWidgetAction]" />
        <sc-button
          class="widget__more"
          variant="secondary"
          appearance="text"
          size="sm"
          [icon]="kebabIcon"
          [ariaLabel]="'dashboard.widget.more_actions' | translate: { title: title() }"
          ariaHasPopup="menu"
          [ariaExpanded]="menuOpen()"
          [ariaControls]="menuId"
          (clicked)="menu.toggle($event)"
        />
      </div>
    }
  </ng-template>

  <ng-content />
</sc-panel>

<p-tieredmenu
  #menu
  [id]="menuId"
  [model]="menuItems()"
  [popup]="true"
  appendTo="body"
  (onShow)="menuOpen.set(true)"
  (onHide)="menuOpen.set(false)"
/>
