<!-- Un aviso, pinte el contenedor que lo pinte. -->
<ng-template #toastItem let-message>
  <div
    class="sc-toast"
    role="status"
    aria-live="assertive"
    aria-atomic="true"
    [attr.data-severity]="message.severity ?? 'info'"
  >
    <div class="sc-toast__icon" aria-hidden="true">
      <sc-icon [name]="iconFor(message.severity)" [size]="14" />
    </div>
    <div class="sc-toast__body">
      @if (message.summary) {
        <div class="sc-toast__title">{{ message.summary }}</div>
      }
      @if (message.detail) {
        <div class="sc-toast__message">{{ message.detail }}</div>
      }
    </div>
    @if (message.data?.undoEntryId; as undoId) {
      <sc-button class="sc-toast__action" variant="secondary" appearance="outlined" size="sm" [label]="'common.undo' | translate" (clicked)="onUndoClick(undoId)" />
    }
    <sc-button class="sc-toast__close" variant="secondary" appearance="text" size="sm" [icon]="closeIcon" [ariaLabel]="'common.close' | translate" (clicked)="onClose()" />
  </div>
</ng-template>

<!-- Fuera de la pila de capas de PrimeNG (`autoZIndex` en falso), a `--sc-z-toast`: un diálogo modal se cierra con Esc
     solo si es la capa de arriba, y con el toast de toda acción (DD-211 §5) en pantalla dejaba de hacerlo. -->
<p-toast position="bottom-right" [autoZIndex]="false">
  <ng-template let-message #message>
    <ng-container *ngTemplateOutlet="toastItem; context: { $implicit: message }" />
  </ng-template>
</p-toast>
<!-- Transcripción y análisis de Conversaciones (DD-191 §4): su clave solo la pinta un contenedor con la misma. -->
<p-toast position="bottom-right" [key]="dispatchToastKey" [autoZIndex]="false">
  <ng-template let-message #message>
    <ng-container *ngTemplateOutlet="toastItem; context: { $implicit: message }" />
  </ng-template>
</p-toast>
