<div class="page page--tabla">
  <div class="page__inner page__inner--list">
    <!-- El título vive en el cuerpo: la miga de arriba dice DÓNDE estás y esta línea dice QUÉ miras
         (DD-33). Uno por documento. -->
    <h1 class="page__heading sc-text-h3-semibold">{{ heading() }}</h1>

    <ng-content select="[scListBeforeToolbar]" />

    @if (columnChoices() || searchPlaceholder() || exportable()) {
      <div class="page__action-bar">
        @if (columnPrefs(); as prefs) {
          <!-- El selector de columnas NATIVO: el ejemplo «Column Toggle» de primeng.dev/table, un MultiSelect
               (DD-113). Solo decide qué se ve; el orden se cambia arrastrando las cabeceras de la tabla. Dice
               siempre «N columnas» (`maxSelectedLabels` 0) y la columna fija sale marcada y sin poder quitarse. -->
          <sc-multiselect
            class="page__columns"
            [options]="columnOptions()"
            optionLabel="label"
            optionValue="key"
            optionDisabled="locked"
            [value]="$any(prefs.visible)"
            (valueChange)="onVisibleChange($event)"
            [maxSelectedLabels]="0"
            [selectedItemsLabel]="'common.columns_count' | translate"
            [placeholder]="'common.columns' | translate"
            [ariaLabel]="'common.columns' | translate"
          />
        }
        @if (searchPlaceholder(); as placeholder) {
          <sc-search
            class="page__search"
            [placeholder]="placeholder"
            shortcutHint="/"
            [clearAriaLabel]="'labels.clear_search' | translate"
            [value]="query()"
            (valueChange)="query.set($event)"
            (keydown)="onSearchKey($event)"
          />
        }
        @if (exportable()) {
          <sc-divider layout="vertical" />
          <sc-button
            variant="secondary"
            appearance="outlined"
            icon="download"
            [ariaLabel]="'labels.export_button' | translate"
            [attr.title]="'labels.export_button' | translate"
            (clicked)="onExport()"
          />
        }
      </div>
    }

    @if (isEmpty()) {
      <ng-content select="[scListEmpty]" />
    } @else {
      <div class="table-card" [class.table-card--seleccion]="selectedIds().size > 0">
        <!-- Ancho ajustable y orden arrastrando, solo en las listas que eligen columnas: la tabla ajustable nativa
             recorta cada celda (`overflow: hidden`), y en Etiquetas eso dejaba fuera de sitio el panel que se
             ancla dentro de la celda (medido: `admin-datatable-pilot`, el panel 70px por encima de su fila). -->
        <sc-datatable
          scrollable
          scrollHeight="flex"
          virtualScroll
          [resizableColumns]="!!columnChoices()"
          [reorderableColumns]="!!columnChoices()"
          (columnOrderChange)="onColumnOrderChange($event)"
          (columnWidthsChange)="onColumnWidthsChange($event)"
          [tableMinWidth]="effectiveTableMinWidth()"
          variant="list"
          [value]="displayed()"
          [columns]="allColumns()"
          [visibleColumns]="visibleColumns()"
          [rowStyleClass]="rowStyleClass()"
          dataKey="id"
          [selectionMode]="selectable() ? 'multiple' : null"
          [rowSelectionAriaLabel]="rowAriaLabel"
          [selectAllAriaLabel]="selectAllAriaLabel()"
          [selection]="selectedRows()"
          [sortField]="tableSortField()"
          [sortOrder]="tableSortOrder()"
          (sortChange)="onSortChange($event)"
          (selectionChange)="onSelectionChange($any($event))"
          [rowsFocusable]="rowsFocusable()"
          (rowClick)="onRowClick($event)"
          (rowKeydown)="onRowKeydown($event)"
          (rowContextMenu)="onRowContextMenu($event, rowMenuRef)"
          [attr.data-testid]="tableTestId()"
        >
          <!-- Búsqueda sin resultados: el MISMO vacío del DS que el resto de la app, dentro de la tabla
               (plantilla vacía de p-table), con la cabecera visible y el botón para limpiar la búsqueda
               (2026-09-14). Una pantalla con dos casos distintos proyecta `[scListNoResults]`. -->
          <div scTableEmpty>
            <ng-content select="[scListNoResults]">
              <sc-empty-state
                icon="search_off"
                titleKey="labels.no_results.title"
                [bodyKey]="noResultsKey()"
                [params]="noResultsParamsWithQuery()"
                [ctaKey]="query() ? 'labels.clear_search' : null"
                ctaIcon="close"
                (cta)="query.set('')"
              />
            </ng-content>
          </div>
        </sc-datatable>
      </div>
    }
  </div>
</div>

<!-- Celda del menú de fila. `stopPropagation` (en `openRowMenu`): la fila abre el detalle. -->
<ng-template #actionsTpl let-row>
  <sc-button
    class="rules-kebab-btn"
    variant="secondary"
    appearance="text"
    size="sm"
    icon="more_vert"
    [ariaLabel]="'labels.row_menu' | translate"
    (clicked)="openRowMenu(row, rowMenuRef, $event)"
  />
</ng-template>

<!-- Menú ÚNICO para toda la tabla: «⋮» y clic derecho abren este mismo (R3). -->
<p-menu #rowMenuRef [model]="menuItems()" [popup]="true" appendTo="body" styleClass="rules-kebab-menu" />

@if (selectable() && bulkEntity(); as entity) {
  <sc-bulk-action-bar [count]="selectedIds().size" [entity]="entity" (clear)="clearSelection()">
    <ng-content select="[scListBulkActions]" />
  </sc-bulk-action-bar>
}
