<span
  class="avatar"
  [class.avatar--icon]="!photoSrc()"
  [style.--avatar-size]="sizePx()"
  [style.font-size]="photoSrc() ? null : iconSize()"
  [attr.aria-label]="name()"
  role="img"
>
  @if (photoSrc(); as src) {
    <img class="avatar__media" [src]="src" [alt]="name()" />
  } @else {
    <!-- Sin foto: el avatar de tipo Icon del Kit (círculo, icono de usuario), no una cara inventada. -->
    <sc-icon class="avatar__icon" name="user" size="inherit" aria-hidden="true" />
  }
</span>
