    <!--
      Brand font. The Smart Contact design system uses Inter for ALL roles
      (the Figma text styles are Inter, captions included). Open Sans is no
      longer loaded (it was captions-only, and captions moved to Inter).
      Without Inter the `font-family` tokens fall back to system-ui, which
      silently drifted every screen away from the Figma.

      They are NO LONGER fetched from Google: the app serves them itself
      (`src/styles/fonts.css`, @fontsource), same as Material Symbols
      below. Same files, same `font-display: swap`, no third-party
      request and no visitor IP leaving for fonts.gstatic.com.
    -->
    <!--
      Material Symbols (Outlined) — icon set del SCDS. Ya NO se carga por CDN:
      el DS lo sirve self-hospedado (@fontsource), importado en main.scss vía
      `@smartcontact-hub/icons/styles/material-symbols.css`. Fuente única.
    -->
