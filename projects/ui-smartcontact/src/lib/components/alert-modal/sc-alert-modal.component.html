<!-- `role` es la entrada de la carcasa (el rol que pone al diálogo de PrimeNG), no un atributo de este elemento. -->
<sc-custom-modal
  [role]="dialogRole"
  iconSize="lg"
  [title]="title()"
  [icon]="headerIcon()"
  [showCloseButton]="showCloseButton()"
  [closeVariant]="closeVariant()"
  [closeIconSize]="plain() ? 'sm' : 'lg'"
  [closeAriaLabel]="closeAriaLabel()"
  [closeRequested]="closeRequested()"
  [ariaDescribedBy]="message() ? messageId : null"
  [surfaceClass]="surfaceClass()"
  bodyClass="sc-alert-modal__body"
  (closed)="onClosed()"
>
  @if (message(); as msg) {
    @if (plain()) {
      <!-- Blanca (DD-242): el icono va junto al mensaje, como en el confirm centrado de antes. -->
      <div scCustomModalBody class="sc-alert-modal__content">
        @if (resolvedIcon(); as ic) {
          <span class="sc-alert-modal__icon" aria-hidden="true"><sc-icon [name]="ic" size="inherit" /></span>
        }
        <div class="sc-alert-modal__message" [id]="messageId" [innerHTML]="msg"></div>
      </div>
    } @else {
      <div scCustomModalBody class="sc-alert-modal__message" [id]="messageId" [innerHTML]="msg"></div>
    }
  }

  @if (tertiaryActionLabel(); as label) {
    <sc-button
      #tertiaryBtn
      scCustomModalFooter
      class="sc-alert-modal__tertiary"
      [label]="label"
      [variant]="plain() ? 'secondary' : 'primary'"
      appearance="text"
      (clicked)="onTertiary()"
    />
  }
  @if (secondaryActionLabel(); as label) {
    <sc-button
      #secondaryBtn
      scCustomModalFooter
      [label]="label"
      [variant]="buttons().secondary.variant"
      [appearance]="buttons().secondary.appearance"
      (clicked)="onSecondary()"
    />
  }
  @if (actionLabel(); as label) {
    <sc-button
      #primaryBtn
      scCustomModalFooter
      [label]="label"
      [variant]="buttons().primary.variant"
      [appearance]="buttons().primary.appearance"
      (clicked)="onAction()"
    />
  }
</sc-custom-modal>
