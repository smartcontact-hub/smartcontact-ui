<!--
  El TÍTULO sale de una plantilla y no escrito dos veces: entre `collapsible` y `headingLevel`
  hay cuatro combinaciones, y cuatro copias de la misma línea es exactamente como una de ellas
  se queda atrás al tocar las otras tres.
-->
<ng-template #tituloTpl>
  @if (headingLevel() === 1) {
    <h1 class="section-card__title">{{ titleKey() | translate }}</h1>
  } @else {
    <h2 class="section-card__title">{{ titleKey() | translate }}</h2>
  }
</ng-template>

<section class="section-card" [attr.id]="anchorId()" [attr.data-section-anchor]="anchorId()">
  @if (collapsible()) {
    <button
      type="button"
      class="section-card__head section-card__head--toggle"
      [class.section-card__head--collapsed]="!open()"
      [attr.aria-expanded]="open()"
      (click)="toggle()"
    >
      @if (icon(); as ic) {
        <sc-icon [name]="ic" [size]="headIconSize" class="section-card__icon" />
      }
      <ng-container [ngTemplateOutlet]="tituloTpl" />
      @if (hintKey()) {
        <span class="section-card__hint">{{ hintKey()! | translate }}</span>
      }
      <sc-icon
        [name]="open() ? chevronDownIcon : chevronRightIcon"
        [size]="headIconSize"
        class="section-card__chevron"
      />
    </button>
  } @else {
    <header class="section-card__head">
      @if (icon(); as ic) {
        <sc-icon [name]="ic" [size]="headIconSize" class="section-card__icon" />
      }
      <ng-container [ngTemplateOutlet]="tituloTpl" />
      @if (hintKey()) {
        <span class="section-card__hint">{{ hintKey()! | translate }}</span>
      }
    </header>
  }
  @if (!collapsible() || open()) {
    <div class="section-card__body">
      <ng-content />
    </div>
  }
</section>
