@if (label() && !iftaLabel()) {
  <sc-field-label
    block="sc-multiselect"
    [text]="label()!"
    [required]="required()"
    [for]="resolvedId()"
    [labelId]="labelId()"
  />
}

<div class="sc-multiselect__field">
  <!-- `[selectAll]="null"` no es ruido: PrimeNG 22.1.0 deja `selectAll` en undefined y compara con
       `!== null`, así que sin él «todo seleccionado» es siempre falso y la casilla de arriba marca
       todo en cada clic sin desmarcar nunca. `null` = la selección la calcula el propio control. -->
  <p-multiselect
    [ariaLabelledBy]="resolvedLabelledBy()"
    class="sc-multiselect__control"
    [inputId]="resolvedId()"
    [options]="optionsMutable()"
    [optionLabel]="resolvedOptionLabel()"
    [optionValue]="resolvedOptionValue()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [display]="display()"
    [filter]="filter()"
    [filterBy]="filterBy() ?? resolvedOptionLabel()"
    [filterPlaceHolder]="filterPlaceholder()"
    [showToggleAll]="showToggleAll()"
    [selectAll]="null"
    [selectionLimit]="selectionLimit() ?? null"
    [maxSelectedLabels]="maxSelectedLabels()"
    [selectedItemsLabel]="selectedItemsLabel()"
    [showClear]="showClear()"
    [emptyFilterMessage]="emptyFilterMessage()"
    [emptyMessage]="emptyMessage()"
    [size]="pSize()"
    [panelStyleClass]="panelStyleClass()"
    [appendTo]="appendTo()"
    [ngModel]="value()"
    (ngModelChange)="onModelChange($event)"
    (onFocus)="onFocus($event)"
    (onBlur)="onBlur($event)"
    [attr.name]="name() ?? null"
    [attr.aria-describedby]="footerText() ? msgId() : null"
    [attr.aria-required]="required() ? true : null"
    [attr.aria-invalid]="isInvalid() ? true : null"
  />

  @if (iftaLabel() && label()) {
    <label class="sc-multiselect__ifta-label" [attr.for]="resolvedId()" [attr.id]="labelId()">
      {{ label() }}
      @if (required()) {
        <span class="sc-multiselect__required" aria-hidden="true">*</span>
      }
    </label>
  }
</div>

@if (footerText()) {
  <sc-field-msg
    block="sc-multiselect"
    [text]="footerText()"
    [isError]="!!error()"
    [msgId]="msgId()"
  />
}
