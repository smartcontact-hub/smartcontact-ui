<div class="empty-state" role="status" aria-live="polite">
  <div class="empty-state__icon" aria-hidden="true">
    <sc-icon [name]="icon()" [size]="iconSizeDisplay" />
  </div>
  <h2 class="empty-state__title">{{ titleKey() | translate: params() }}</h2>
  @if (bodyKey()) {
    <p class="empty-state__body">{{ bodyKey() | translate: params() }}</p>
  }
  @if (ctaKey(); as cta) {
    <!-- El botón del DS, no uno propio (2026-09-14): el de antes era un <button> hecho a mano,
         sin radio, a 12 px y 44 de alto, y se leía distinto de cualquier otro botón de la app. -->
    <sc-button
      class="empty-state__cta"
      variant="primary"
      [icon]="ctaIcon()"
      [label]="cta | translate"
      (clicked)="onCtaClick($event)"
    />
  }
</div>
