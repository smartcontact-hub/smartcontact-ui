<sc-dialog
  [visible]="visible()"
  [icon]="alertIcon"
  [title]="dialogTitle()"
  [subtitle]="dialogSubtitle()"
  width="440px"
  (cancelled)="cancelled.emit()"
>
  <!-- Uno o varios, la misma forma: el título dice cuántos, una línea
       opcional de detalle, y la puerta tecleada. Antes el lote enseñaba un muro de nombres quitables que con 500
       agentes se salía del diálogo y tapaba el campo. -->
  @if (detailMessage(); as detail) {
    <p class="delete-entity__detail">{{ detail }}</p>
  }
  <div class="delete-entity__confirm">
    <label class="delete-entity__confirm-label" for="delete-confirm-input">
      {{ (mode() === 'single' ? 'sc.deleteEntityDialog.typeToConfirm' : 'sc.deleteEntityDialog.typeCountToConfirm') | translate }}
    </label>
    <button
      type="button"
      class="delete-entity__copy-name"
      (click)="onCopy()"
      [title]="'sc.deleteEntityDialog.clickToCopy' | translate"
    >
      <span>{{ confirmTarget() }}</span>
      @if (copied()) {
        <sc-icon [name]="checkIcon" size="inherit" class="delete-entity__copy-check" />
      } @else {
        <sc-icon [name]="copyIcon" size="inherit" class="delete-entity__copy-icon" />
      }
    </button>
    <input
      id="delete-confirm-input"
      type="text"
      class="delete-entity__confirm-input"
      [placeholder]="confirmTarget()"
      [ngModel]="confirmText()"
      (ngModelChange)="confirmText.set($event)"
      autocomplete="off"
    />
  </div>

  <div modal-actions>
    <p-button
      type="button"
      size="small"
      severity="secondary"
      data-testid="delete-cancel-btn"
      (onClick)="cancelled.emit()"
    >
      <span>{{ 'sc.deleteEntityDialog.cancel' | translate }}</span>
    </p-button>
    <p-button
      type="button"
      size="small"
      severity="danger"
      [disabled]="!canConfirm()"
      data-testid="delete-confirm-btn"
      (onClick)="onConfirm()"
    >
      <span>{{ 'sc.deleteEntityDialog.delete' | translate }}</span>
    </p-button>
  </div>
</sc-dialog>
