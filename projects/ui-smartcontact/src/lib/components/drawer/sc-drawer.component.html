<p-drawer
    [visible]="visible()"
    [header]="header() || undefined"
    [position]="position()"
    [modal]="modal()"
    [dismissible]="dismissible()"
    [closeOnEscape]="closeOnEscape()"
    [closable]="showCloseIcon()"
    [ariaCloseLabel]="'sc.drawer.close' | translate"
    [fullScreen]="fullScreen()"
    [style]="panelStyle()"
    [pt]="drawerPt()"
    (visibleChange)="visible.set($event ?? false)"
    (onShow)="onShow($event)"
    (onHide)="hidden.emit($event)">
    <ng-content></ng-content>
</p-drawer>
