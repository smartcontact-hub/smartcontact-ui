@if (label() && !iftaLabel()) {
  <sc-field-label
    block="sc-select"
    [text]="label()!"
    [required]="required()"
    [for]="resolvedId()"
    [labelId]="labelId()"
  />
}

<div class="sc-select__field">
  <p-select
    class="sc-select__control"
    [inputId]="resolvedId()"
    [options]="optionsMutable()"
    [optionLabel]="resolvedOptionLabel()"
    [optionValue]="resolvedOptionValue()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [loading]="loading()"
    [optionDisabled]="optionDisabled()"
    [showClear]="showClear()"
    [editable]="editable()"
    [filter]="filter()"
    [filterBy]="filterBy() ?? optionLabel()"
    [filterPlaceholder]="filterPlaceholder()"
    [emptyFilterMessage]="emptyFilterMessage()"
    [emptyMessage]="emptyMessage()"
    [size]="pSize()"
    [panelStyleClass]="panelStyleClass()"
    [appendTo]="appendTo()"
    [ngModel]="value()"
    (ngModelChange)="onModelChange($event)"
    (onFocus)="onFocus($event)"
    (onBlur)="onBlur($event)"
    [ariaLabelledBy]="resolvedLabelledBy()"
    [attr.name]="name() ?? null"
    [attr.aria-describedby]="footerText() ? msgId() : null"
    [attr.aria-required]="required() ? true : null"
    [invalid]="isInvalid()"
    [attr.aria-invalid]="isInvalid() ? true : null"
  >
    <!--
    Re-proyección de templates: el consumer escribe
    `<ng-template #item let-option>` dentro de `<sc-select>`
    (sintaxis idéntica a `<p-select>` nativo). El sc-select los captura
    via `contentChild(<nombre>)` y los re-emite aquí, porque la consulta del
    p-select NO ve los templates a través de doble content projection
    (limitación de Angular query origin). Desde PrimeNG 22 el nombre tiene que
    ser ESTÁTICO — ver la nota larga en el .ts.
  -->
    @if (itemTpl(); as tpl) {
      <ng-template #item let-data>
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: data }" />
      </ng-template>
    }
    @if (selectedItemTpl(); as tpl) {
      <ng-template #selectedItem let-data>
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: data }" />
      </ng-template>
    }
    @if (headerTpl(); as tpl) {
      <ng-template #header>
        <ng-container *ngTemplateOutlet="tpl" />
      </ng-template>
    }
    @if (footerTpl(); as tpl) {
      <ng-template #footer>
        <ng-container *ngTemplateOutlet="tpl" />
      </ng-template>
    }
    @if (emptyTpl(); as tpl) {
      <ng-template #empty>
        <ng-container *ngTemplateOutlet="tpl" />
      </ng-template>
    }
    @if (groupTpl(); as tpl) {
      <ng-template #group let-data>
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: data }" />
      </ng-template>
    }
  </p-select>

  <!-- La etiqueta DENTRO del campo tiene el mismo problema que la de encima: su `for`
       cae sobre un `<span role="combobox">`, que no es etiquetable. Lleva el mismo `id`
       para que `ariaLabelledBy` la pueda apuntar al revés. -->
  @if (iftaLabel() && label()) {
    <label class="sc-select__ifta-label" [attr.for]="resolvedId()" [attr.id]="labelId()">
      {{ label() }}
      @if (required()) {
        <span class="sc-select__required" aria-hidden="true">*</span>
      }
    </label>
  }
</div>

@if (footerText()) {
  <sc-field-msg
    block="sc-select"
    [text]="footerText()"
    [isError]="!!error()"
    [msgId]="msgId()"
  />
}
