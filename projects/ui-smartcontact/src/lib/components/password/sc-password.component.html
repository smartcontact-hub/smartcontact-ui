@if (label()) {
  <sc-field-label
    block="sc-password"
    [text]="label()!"
    [required]="required()"
    [for]="resolvedId()"
  />
}

<div class="sc-password__field" [class.sc-password__field--toggle]="toggleMask()">
  <!-- `pInputPassword` (PrimeNG 22): el campo con la piel de `pInputText`, y `mask` decide si se ve. -->
  <input
    pInputPassword
    class="sc-password__control"
    [mask]="!unmasked()"
    [id]="resolvedId()"
    [pSize]="pSize()"
    [invalid]="isInvalid()"
    [fluid]="fluid()"
    [value]="value()"
    [disabled]="disabled()"
    [attr.name]="name() ?? null"
    [attr.placeholder]="placeholder() ?? null"
    [attr.autocomplete]="autocomplete() ?? null"
    [attr.maxlength]="maxlength() ?? null"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-invalid]="isInvalid() ? 'true' : null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (focus)="onFocus($event)"
    (blur)="onBlur($event)"
    (keydown)="onKeydown($event)"
  />

  @if (toggleMask()) {
    <!-- Un solo botón para las dos cosas: su nombre dice qué hará. `mousedown` sin defecto, para que el foco siga en
         el campo al pulsarlo con el ratón. -->
    <button
      type="button"
      class="sc-password__toggle"
      [attr.aria-label]="unmasked() ? hideAriaLabel() : showAriaLabel()"
      [attr.aria-controls]="resolvedId()"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="toggle()"
    >
      <sc-icon [name]="unmasked() ? 'visibility_off' : 'visibility'" size="inherit" />
    </button>
  }

  @if (feedback() && meterOpen()) {
    <div class="sc-password__meter" [id]="meterId()">
      <div class="sc-password__meter-track">
        <div class="sc-password__meter-bar" [attr.data-level]="meterLevel()"></div>
      </div>
      <div class="sc-password__meter-text" aria-live="polite">{{ meterText() }}</div>
    </div>
  }
</div>

@if (footerText()) {
  <sc-field-msg
    block="sc-password"
    [text]="footerText()"
    [isError]="!!error()"
    [msgId]="msgId()"
  />
}
