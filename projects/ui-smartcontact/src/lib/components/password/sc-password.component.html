@if (label()) {
  <sc-field-label
    block="sc-password"
    [text]="label()!"
    [required]="required()"
    [for]="resolvedId()"
  />
}

<p-password
  class="sc-password__field"
  inputStyleClass="sc-password__control"
  [inputId]="resolvedId()"
  [ariaLabel]="ariaLabel()"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [name]="pName()"
  [maxlength]="maxlength() ?? null"
  [disabled]="disabled()"
  [invalid]="isInvalid()"
  [fluid]="fluid()"
  [size]="pSize()"
  [feedback]="feedback()"
  [toggleMask]="toggleMask()"
  [pt]="pt()"
  [ngModel]="value()"
  (ngModelChange)="onModelChange($event)"
  (onFocus)="onFocus($event)"
  (onBlur)="onBlur($event)"
>
  <!-- Contraseña OCULTA: el botón la muestra. `iconClass` trae las clases de PrimeNG que
       posicionan el icono dentro del campo y reservan su hueco en el relleno del input. -->
  <ng-template #showicon let-iconClass="class">
    <button
      type="button"
      [class]="'sc-password__toggle ' + iconClass"
      [attr.aria-label]="showAriaLabel()"
      [attr.aria-controls]="resolvedId()"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="onToggle($event)"
    >
      <sc-icon name="visibility" size="inherit" />
    </button>
  </ng-template>

  <!-- Contraseña VISIBLE: el botón la oculta. -->
  <ng-template #hideicon let-iconClass="class">
    <button
      type="button"
      [class]="'sc-password__toggle ' + iconClass"
      [attr.aria-label]="hideAriaLabel()"
      [attr.aria-controls]="resolvedId()"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="onToggle($event)"
    >
      <sc-icon name="visibility_off" size="inherit" />
    </button>
  </ng-template>
</p-password>

@if (footerText()) {
  <sc-field-msg
    block="sc-password"
    [text]="footerText()"
    [isError]="!!error()"
    [msgId]="msgId()"
  />
}
