<!-- `sc-dialog` (DD-140), candidato 5 del barrido: mete el foco, lo retiene y lo devuelve al cerrar; Esc y la máscara
     cierran como en cualquier otro diálogo. -->
<sc-dialog
  [visible]="visible()"
  (cancelled)="onClose()"
  [title]="'sc.keyboardShortcuts.title' | translate"
  [closeAriaLabel]="'sc.keyboardShortcuts.close' | translate"
  [hasFooter]="false"
  [dismissableMask]="true"
>
  @for (group of groups(); track group.title) {
    <div class="kbd-sheet__group">
      <div class="kbd-sheet__group-title">{{ group.title | translate }}</div>
      @for (item of group.items; track item.label) {
        <div class="kbd-sheet__row">
          <span class="kbd-sheet__label">{{ item.label | translate }}</span>
          <span class="kbd-sheet__keys">
            @for (k of item.keys; track $index) {
              <kbd>{{ k }}</kbd>
            }
          </span>
        </div>
      }
    </div>
  }
</sc-dialog>
