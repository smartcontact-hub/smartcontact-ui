<p-button
    [label]="visibleLabel()"
    [disabled]="isInteractionDisabled()"
    [type]="type()"
    [iconPos]="iconPosition()"
    [ariaLabel]="buttonAriaLabel()"
    [loading]="loading()"
    [severity]="buttonSeverity()"
    [size]="buttonSize()"
    [fluid]="fullWidth()"
    [outlined]="outlined()"
    [text]="text()"
    [link]="link()"
    [rounded]="isRounded()"
    [raised]="raised()"
    [plain]="plain()"
    [pTooltip]="tooltipAutomatico() ?? ''"
    [tooltipDisabled]="!tooltipAutomatico()"
    tooltipEvent="both"
    tooltipPosition="top"
    (onClick)="onClick($event)">
    @if (customIcon(); as customIconTpl) {
        <ng-template #icon let-iconClass="class">
            <span [class]="iconClass" aria-hidden="true">
                <ng-container [ngTemplateOutlet]="customIconTpl" />
            </span>
        </ng-template>
    } @else if (buttonIcon(); as resolvedButtonIcon) {
        <ng-template #icon let-iconClass="class">
            <span
                [class]="buttonIconClass(iconClass, resolvedButtonIcon)"
                [attr.aria-hidden]="iconAriaHidden()"
                [attr.aria-label]="iconAccessibleLabel()"
                [attr.role]="iconRole()">
            </span>
        </ng-template>
    }

    <ng-content></ng-content>
</p-button>
