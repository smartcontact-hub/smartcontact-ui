@if (collapsible()) {
  <button
    type="button"
    class="sc-slot__head sc-slot__head--toggle"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    @if (icon(); as ic) {
      <sc-icon [name]="ic" [size]="iconSizeLg" class="sc-slot__icon" />
    }
    <h4 class="sc-slot__title">{{ titleKey() | translate }}</h4>
    @if (hintKey()) {
      <span class="sc-slot__hint">{{ hintKey()! | translate }}</span>
    }
    <sc-icon [name]="open() ? chevronDownIcon : chevronRightIcon" [size]="iconSizeLg" class="sc-slot__chevron" />
  </button>
} @else {
  <div class="sc-slot__head">
    @if (icon(); as ic) {
      <sc-icon [name]="ic" [size]="iconSizeLg" class="sc-slot__icon" />
    }
    <h4 class="sc-slot__title">{{ titleKey() | translate }}</h4>
    @if (hintKey()) {
      <span class="sc-slot__hint">{{ hintKey()! | translate }}</span>
    }
  </div>
}
@if (!collapsible() || open()) {
  <div class="sc-slot__body">
    <ng-content />
  </div>
}
