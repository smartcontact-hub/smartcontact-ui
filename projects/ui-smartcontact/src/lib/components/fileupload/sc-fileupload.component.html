<p-fileupload
  #fu
  [name]="name()"
  [mode]="mode()"
  [multiple]="multiple()"
  [accept]="accept()"
  [maxFileSize]="maxFileSize()"
  [fileLimit]="fileLimit()"
  [disabled]="disabled()"
  [auto]="auto()"
  [customUpload]="!url()"
  [url]="url()"
  [chooseLabel]="chooseLabel()"
  [uploadLabel]="uploadLabel()"
  [cancelLabel]="cancelLabel()"
  [showUploadButton]="!auto()"
  [showCancelButton]="!auto()"
  [invalidFileSizeMessageSummary]="invalidFileSizeMessageSummary()"
  [invalidFileSizeMessageDetail]="invalidFileSizeMessageDetail()"
  [invalidFileTypeMessageSummary]="invalidFileTypeMessageSummary()"
  [invalidFileTypeMessageDetail]="invalidFileTypeMessageDetail()"
  [pt]="pt()"
  (onSelect)="onSelect($event)"
  (onRemove)="fileRemoved.emit($event.file)"
  (onClear)="cleared.emit()"
  (uploadHandler)="onUploadHandler($event.files)"
  (onRemoveUploadedFile)="onRemoveUploaded($event.file)"
>
  <!-- La zona de soltar, tal como la del ejemplo «advanced» de primeng.dev: solo el texto. Va dentro de este
       componente porque la consulta de `p-fileupload` no ve una plantilla que atraviesa dos proyecciones. -->
  <!-- El icono del botón de elegir, el del DS (`sc-icon`): el `chooseIcon` de PrimeNG es una clase de fuente de iconos. -->
  <ng-template #chooseicon><sc-icon [name]="chooseIcon()" size="inherit" /></ng-template>
  @if (dropLabel()) {
    <ng-template #empty>
      <div class="sc-fileupload__drop">{{ dropLabel() }}</div>
    </ng-template>
  }
</p-fileupload>
