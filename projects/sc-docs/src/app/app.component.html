          <path d="M71.2952 97.4189C58.1827 97.4189 47.5546 86.7933 47.5546 73.6874C47.5546 60.5798 58.1827 49.9542 71.2952 49.9542C84.4078 49.9542 95.0358 60.5798 95.0358 73.6874C95.0358 86.7933 84.4078 97.4189 71.2952 97.4189Z" fill="currentColor" />
          <path d="M15.8104 89.3982C7.07869 89.3982 0 82.3222 0 73.5939C0 64.8638 7.07869 57.7879 15.8104 57.7879C24.5421 57.7879 31.6208 64.8638 31.6208 73.5939C31.6208 82.3222 24.5421 89.3982 15.8104 89.3982Z" fill="currentColor" />

        </svg>
      </span>
      <span class="demo-sidebar__brand-text">
        <span class="demo-sidebar__brand-name">Smart Contact</span>
        <span class="demo-sidebar__brand-sub">Design Engineering</span>
      </span>
    </a>

    <button type="button" class="demo-sidebar__search" (click)="palette.open()">
      <span class="demo-sidebar__search-label">Buscar…</span>
      <kbd class="demo-sidebar__kbd">⌘K</kbd>
    </button>

    <nav class="demo-sidebar__nav" aria-label="Secciones">
      <a routerLink="/fundamentos" routerLinkActive="is-active">Fundamentos</a>

      <a class="demo-sidebar__lead" routerLink="/components" routerLinkActive="is-active">
        <span>Componentes</span>
        <span class="demo-sidebar__count">{{ total }}</span>
      </a>
      @if (onComponents()) {
        <div class="demo-sidebar__sub">
          @for (group of groups; track group.category) {
            <p class="demo-sidebar__group">{{ group.category }}</p>
            @for (e of group.items; track e.path) {
              <a
                class="demo-sidebar__sublink"
                [routerLink]="['/components', e.path]"
                routerLinkActive="is-active"
                >{{ e.label }}</a
              >
            }
          }
        </div>
      }

      <a routerLink="/uso" routerLinkActive="is-active">Uso real</a>
      <a routerLink="/reglas" routerLinkActive="is-active">Reglas</a>
    </nav>

    <!-- Cluster de herramientas: NO son documentación, por eso van separadas de la nav. -->
    <div class="demo-sidebar__tools">
      <a class="demo-sidebar__tool" routerLink="/lab" routerLinkActive="is-active">Lab</a>
      <button type="button" class="demo-sidebar__tool" (click)="toggleDark()">Claro / oscuro</button>
    </div>
  </aside>

  <main class="demo-main">
    <router-outlet />
  </main>
</div>

<sc-command-palette />
