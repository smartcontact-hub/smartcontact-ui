<app-story-host [meta]="meta" [stories]="stories()" />

<!-- Stories declaradas como `<ng-template>`: el motor las pinta en su canvas. El
     Playground recibe `args` (knobs); los ejemplos son estáticos. Los `data-testid`
     los miden los e2e de métrica del Kit (no quitar). -->

<ng-template #playground let-args>
  <sc-panel
    [header]="args.header || null"
    [toggleable]="args.toggleable"
    [collapsed]="args.collapsed"
    [showHeader]="args.showHeader"
    [fill]="args.fill"
    [severity]="args.severity || null"
  >
    Contenido del panel.
  </sc-panel>
</ng-template>

<ng-template #basic>
  <sc-panel header="Panel básico" data-testid="sc-panel"> Contenido del panel. </sc-panel>
  <sc-panel header="Colapsable" [toggleable]="true"> Contenido colapsable. </sc-panel>
</ng-template>

<ng-template #iconsStory>
  <sc-panel header="Colas" data-testid="sc-panel-icons">
    <ng-template #icons>
      <sc-button
        icon="more_vert"
        variant="secondary"
        appearance="text"
        size="sm"
        [rounded]="true"
        ariaLabel="Opciones de Colas"
      />
    </ng-template>
    Contenido del panel.
  </sc-panel>
</ng-template>

<!-- El alto lo fija el contenedor (un paso de escala, como haría la rejilla del Dashboard). -->
<ng-template #fillStory>
  <div style="height: var(--sc-spacing-18)" data-testid="sc-panel-fill-slot">
    <sc-panel header="Agentes" [fill]="true" data-testid="sc-panel-fill">
      <div style="flex: 1 1 auto; min-height: 0; overflow: auto">Contenido que se estira hasta el pie del hueco.</div>
    </sc-panel>
  </div>
</ng-template>

<ng-template #severityStory>
  <sc-panel header="Colas" severity="warn" data-testid="sc-panel-warn">Hay llamadas esperando más de lo normal.</sc-panel>
  <sc-panel header="Agentes" severity="danger" data-testid="sc-panel-danger">Ningún agente disponible.</sc-panel>
</ng-template>

<ng-template #headerStory>
  <sc-panel data-testid="sc-panel-header">
    <ng-template #header let-titleId>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <h3 [id]="titleId" class="sc-text-body-semibold" style="margin: 0">Tiempo medio de espera</h3>
        <span class="sc-text-caption-regular">Colas: Soporte, Ventas</span>
      </div>
    </ng-template>
    Contenido del panel.
  </sc-panel>
</ng-template>
