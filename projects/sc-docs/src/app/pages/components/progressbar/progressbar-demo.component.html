<app-story-host [meta]="meta" [stories]="stories()" />

<!-- Stories declaradas como `<ng-template>`: el motor las pinta en su canvas. El
     Playground recibe `args` (knobs); los ejemplos son estáticos. Los `data-testid`
     los miden los e2e de métrica del Kit (no quitar). -->

<!-- La barra ocupa el ancho de su contenedor: va en una `.col`, que le da uno. Suelta en el lienzo, que es una fila
     flex, medía 0. -->
<ng-template #playground let-args>
  <div class="col">
    <sc-progressbar
      [value]="args.value"
      [showValue]="args.showValue"
      [unit]="args.unit"
      [mode]="args.mode"
      ariaLabel="Progreso de la tarea"
    />
  </div>
</ng-template>

<ng-template #modes>
  <div class="col">
    <sc-progressbar [value]="40" ariaLabel="Subida del fichero" data-testid="sc-progressbar" />
    <sc-progressbar [value]="80" [showValue]="false" ariaLabel="Importación de contactos" />
    <sc-progressbar mode="indeterminate" ariaLabel="Cargando datos" />
  </div>
</ng-template>
