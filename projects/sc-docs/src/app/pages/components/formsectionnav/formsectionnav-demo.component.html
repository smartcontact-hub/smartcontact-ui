<app-story-host [meta]="meta" [stories]="stories()" />

<!-- Stories declaradas como `<ng-template>`: el motor las pinta en su canvas. El
     Playground recibe `args` (knobs). `sections`/`activeId`/`sectionsWithErrors`
     son objetos → viven en el componente y se bindean directo. Los `data-testid`
     los miden los e2e de métrica del Kit (no quitar). -->

<ng-template #playground let-args>
  <div style="max-width: 260px">
    <sc-form-section-nav
      [sections]="sections"
      [activeId]="active()"
      [sectionsWithErrors]="errors"
      [flush]="args.flush"
      [titleKey]="args.titleKey || null"
      [labelKey]="args.labelKey"
      (activeChange)="onActive($event)"
    />
  </div>
</ng-template>

<!-- La forma en la que lo usan las pantallas (DD-122): cada fila un enlace con su `href` (Cmd+clic
     abre otra pestaña de esta página, en esa sección), el rótulo encima y las dos marcas: «Voz y
     saludo» con cambios sin guardar y «Horario» con algo obligatorio sin rellenar. -->
<ng-template #links>
  <div class="row" style="max-width: 260px">
    <sc-form-section-nav
      [sections]="sections"
      [activeId]="active()"
      titleKey="Contact Center"
      [flush]="true"
      [sectionsWithErrors]="errors"
      [sectionsWithChanges]="changes"
      (activeChange)="onActive($event)"
    />
  </div>
</ng-template>

<ng-template #default>
  <div class="row" style="max-width: 260px">
    <sc-form-section-nav
      [sections]="sections"
      [activeId]="active()"
      [sectionsWithErrors]="errors"
      (activeChange)="onActive($event)"
      data-testid="sc-formnav-default"
    />
  </div>
</ng-template>

<!-- El caso que motivó DD-52: rótulos que NO caben en el rail. Está en las
     stories para que la respuesta del componente («envuelvo, no escondo») se vea
     sin tener que abrir un formulario del Supervisor. -->
<ng-template #long>
  <div class="row" style="max-width: 260px">
    <sc-form-section-nav
      [sections]="longSections"
      [activeId]="longActive()"
      [sectionsWithErrors]="longErrors"
      [flush]="true"
      (activeChange)="onLongActive($event)"
      data-testid="sc-formnav-long"
    />
  </div>
</ng-template>

<ng-template #flush>
  <div class="row" style="max-width: 260px">
    <sc-form-section-nav
      [sections]="sections"
      [activeId]="active()"
      [flush]="true"
      [sectionsWithErrors]="errors"
      (activeChange)="onActive($event)"
      data-testid="sc-formnav-flush"
    />
  </div>
</ng-template>
