<app-story-host [meta]="meta" [stories]="stories()" />

<ng-template #playground let-args>
  <sc-datepicker
    [label]="args.label"
    [placeholder]="args.placeholder"
    [helperText]="args.helperText || undefined"
    [error]="args.error || undefined"
    [dateFormat]="args.dateFormat"
    [view]="args.view"
    [size]="args.size"
    [required]="args.required"
    [showIcon]="args.showIcon"
    [showClear]="args.showClear"
    [showButtonBar]="args.showButtonBar"
    [inline]="args.inline"
    [disabled]="args.disabled"
    [(value)]="value"
  />
</ng-template>

<ng-template #basico>
  <div class="col">
    <sc-datepicker label="Fecha de inicio" [(value)]="value" data-testid="sc-datepicker" />
    <p>Valor: «{{ value() ? value()!.toLocaleDateString('es-ES') : '' }}»</p>
  </div>
</ng-template>

<!-- Los inputs que ningún ejemplo enseñaba. -->
<ng-template #menosVistos>
  <div class="col">
    <sc-datepicker
      label="Solo este mes"
      [minDate]="primerDia"
      [maxDate]="ultimoDia"
      [(value)]="acotada"
      data-testid="sc-datepicker-rango"
    />
    <sc-datepicker label="Inválida, sin texto de error" [invalid]="true" data-testid="sc-datepicker-invalid" />
    <sc-datepicker label="Abre en junio" [defaultDate]="junio" [(value)]="otra" data-testid="sc-datepicker-mes" />
    <p>Acotada: «{{ acotada() ? acotada()!.toLocaleDateString('es-ES') : '—' }}»</p>
  </div>
</ng-template>

<!-- Rango con atajos: la selección por rango y la plantilla «buttonbar» de primeng.dev/datepicker. -->
<ng-template #rango>
  <div class="col">
    <sc-datepicker
      label="Periodo"
      selectionMode="range"
      placeholder="Cualquier fecha"
      [presets]="atajos"
      clearLabel="Quitar periodo"
      [(range)]="periodo"
      [showClear]="true"
      data-testid="sc-datepicker-range"
    />
    <p>Periodo: «{{ periodoTexto() }}»</p>
  </div>
</ng-template>

<!-- Días sueltos, con el calendario a la vista: el modo «multiple» de primeng.dev/datepicker. -->
<ng-template #varios>
  <div class="col">
    <sc-datepicker inline selectionMode="multiple" ariaLabel="Días festivos" [(dates)]="festivos" data-testid="sc-datepicker-multiple" />
    <p>Marcados: {{ festivos()?.length ?? 0 }}</p>
  </div>
</ng-template>

<!-- Solo la hora: «timeOnly» de primeng.dev/datepicker. -->
<ng-template #hora>
  <div class="col">
    <sc-datepicker label="Apertura" [timeOnly]="true" placeholder="hh:mm" [stepMinute]="15" [(value)]="apertura" data-testid="sc-datepicker-time" />
  </div>
</ng-template>

<ng-template #estados>
  <div class="col">
    <sc-datepicker label="Obligatoria" [required]="true" />
    <sc-datepicker label="Con error" error="La fecha no es válida" data-testid="sc-datepicker-error" />
    <sc-datepicker label="Deshabilitada" [disabled]="true" />
  </div>
</ng-template>
