<app-story-host [meta]="meta" [stories]="stories()" />

<!-- Inline cell + hover popover: los datos van en `[groups]`. El Playground muestra una celda; la 2ª story
     contrasta pocos vs. muchos (salen todos), y la 3ª cuenta lo que avisa `activated`. Los `data-testid` los miden
     los e2e (no quitar). -->

<ng-template #playground let-args>
  <sc-group-popover [groups]="few" data-testid="sc-grouppopover-few" />
</ng-template>

<ng-template #overflow>
  <sc-group-popover [groups]="few" />
  <sc-group-popover [groups]="many" data-testid="sc-grouppopover-many" />
</ng-template>

<ng-template #activar>
  <div class="col">
    <sc-group-popover [groups]="few" (activated)="onActivated()" data-testid="sc-grouppopover-activated" />
    <p class="demo-readout">
      Veces que se pulsó la cifra: <strong data-testid="sc-grouppopover-activated-count">{{ pulsaciones() }}</strong>
    </p>
  </div>
</ng-template>
