<app-story-host [meta]="meta" [stories]="stories()" />

<ng-template #playground let-args>
  <sc-password
    [label]="args.label"
    [value]="args.value"
    [placeholder]="args.placeholder"
    [helperText]="args.helperText || undefined"
    [error]="args.error || undefined"
    [size]="args.size"
    [required]="args.required"
    [invalid]="args.invalid"
    [fluid]="args.fluid"
    [disabled]="args.disabled"
    [toggleMask]="args.toggleMask"
    [feedback]="args.feedback"
    [showAriaLabel]="args.showAriaLabel"
    [hideAriaLabel]="args.hideAriaLabel"
  />
</ng-template>

<ng-template #basic>
  <div class="col">
    <sc-password
      label="Contraseña"
      autocomplete="current-password"
      name="password"
      [(value)]="password"
      data-testid="sc-password"
    />
    <p>Caracteres: {{ password().length }}</p>
  </div>
</ng-template>

<ng-template #states>
  <div class="col">
    <sc-password label="Obligatoria" [required]="true" helperText="Mínimo 8 caracteres" />
    <sc-password label="Con error" error="La contraseña no es correcta" data-testid="sc-password-error" />
    <sc-password label="Deshabilitada" [disabled]="true" value="secreto" />
    <sc-password label="Sin botón de mostrar" [toggleMask]="false" />
    <sc-password ariaLabel="Contraseña" placeholder="Sin etiqueta visible" />
  </div>
</ng-template>

<ng-template #sizes>
  <div class="col">
    <sc-password label="Small" size="sm" data-testid="sc-password-sm" />
    <sc-password label="Medium" data-testid="sc-password-md" />
    <sc-password label="Large" size="lg" data-testid="sc-password-lg" />
    <sc-password label="Fluid" [fluid]="true" />
  </div>
</ng-template>

<ng-template #i18n>
  <div class="col">
    <sc-password
      label="Password"
      inputId="login-password"
      autocomplete="current-password"
      [maxlength]="64"
      showAriaLabel="Show password"
      hideAriaLabel="Hide password"
      (focused)="lastEvent.set('focused')"
      (blurred)="lastEvent.set('blurred')"
    />
    <p>Último evento: {{ lastEvent() }}</p>
  </div>
</ng-template>
