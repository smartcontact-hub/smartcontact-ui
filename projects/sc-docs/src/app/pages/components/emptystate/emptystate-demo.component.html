<app-story-host [meta]="meta" [stories]="stories()" />

<!-- Stories declaradas como `<ng-template>`: el motor las pinta en su canvas. El
     Playground recibe `args` (knobs); los ejemplos son estáticos. Los `data-testid`
     los miden los e2e de métrica del Kit (no quitar). -->

<ng-template #playground let-args>
  <sc-empty-state
    [icon]="args.icon"
    [titleKey]="args.titleKey"
    [bodyKey]="args.bodyKey"
    [ctaKey]="args.ctaKey || null"
    [ctaIcon]="args.ctaIcon || null"
  />
</ng-template>

<ng-template #plain>
  <sc-empty-state
    icon="inbox"
    titleKey="No hay agentes todavía"
    bodyKey="Crea tu primer agente para empezar a recibir llamadas."
    data-testid="sc-emptystate-plain"
  />
</ng-template>

<ng-template #cta>
  <sc-empty-state
    icon="group"
    titleKey="Sin grupos"
    bodyKey="Agrupa tus agentes para organizarlos por equipo o campaña."
    ctaKey="Crear grupo"
    (cta)="onCreate()"
    data-testid="sc-emptystate-cta"
  />
  <p class="demo-readout">
    Veces que se pulsó la CTA: <strong data-testid="sc-emptystate-cta-count">{{ pulsaciones() }}</strong>
  </p>
</ng-template>

<!-- Búsqueda sin resultados: `params` interpola `{{query}}` en título y cuerpo. Es el vacío que
     pintan todas las listas del Supervisor dentro de su tabla. -->
<ng-template #busqueda>
  <sc-empty-state
    icon="search_off"
    titleKey="components.emptystate.search_title"
    bodyKey="components.emptystate.search_body"
    [params]="{ query: consulta() }"
    ctaKey="components.emptystate.clear_search"
    ctaIcon="close"
    (cta)="consulta.set('')"
    data-testid="sc-emptystate-search"
  />
</ng-template>
