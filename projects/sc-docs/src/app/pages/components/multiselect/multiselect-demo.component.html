<app-story-host [meta]="meta" [stories]="stories()" />

<ng-template #playground let-args>
  <sc-multiselect
    [label]="args.label"
    [options]="groups"
    [placeholder]="args.placeholder"
    [helperText]="args.helperText || undefined"
    [error]="args.error || undefined"
    [display]="args.display"
    [size]="args.size"
    [required]="args.required"
    [filter]="args.filter"
    [showToggleAll]="args.showToggleAll"
    [showClear]="args.showClear"
    [filled]="args.filled"
    [iftaLabel]="args.iftaLabel"
    [disabled]="args.disabled"
    [(value)]="value"
  />
</ng-template>

<ng-template #basico>
  <sc-multiselect label="Grupos" [options]="groups" placeholder="Selecciona grupos" [(value)]="value" data-testid="sc-multiselect" />
</ng-template>

<!-- Los inputs que ningún ejemplo enseñaba. Mismo molde que en `sc-select`: cada uno con su
     ejemplo VIVO al lado, no solo en el bloque de código. -->
<ng-template #menosVistos>
  <div class="col">
    <sc-multiselect
      label="Objetos: qué campo es la etiqueta y cuál el valor"
      [options]="prioridades"
      optionLabel="name"
      optionValue="id"
      [filter]="true"
      filterBy="name"
      emptyFilterMessage="Ninguna prioridad se llama así"
      placeholder="Elige prioridades"
      data-testid="sc-multiselect-objetos"
    />
    <sc-multiselect
      label="Como mucho dos, y a la tercera se pliega"
      [options]="groups"
      [selectionLimit]="2"
      [maxSelectedLabels]="1"
      selectedItemsLabel="{0} grupos elegidos"
      placeholder="Máximo dos"
      data-testid="sc-multiselect-limite"
    />
    <sc-multiselect
      label="Inválido, sin texto de error"
      [options]="groups"
      [invalid]="true"
      placeholder="Marca el campo sin decir por qué"
      data-testid="sc-multiselect-invalid"
    />
    <sc-multiselect
      label="Sin opciones"
      [options]="[]"
      emptyMessage="Todavía no hay grupos"
      data-testid="sc-multiselect-empty"
    />
    <p>Elegidos: «{{ elegidos().join(', ') || '—' }}»</p>
  </div>
</ng-template>

<ng-template #estados>
  <div class="col">
    <sc-multiselect label="Con chips" [options]="groups" display="chip" />
    <sc-multiselect label="Con filtro" [options]="groups" [filter]="true" />
    <sc-multiselect label="Con error" [options]="groups" error="Selecciona al menos uno" data-testid="sc-multiselect-error" />
  </div>
</ng-template>
