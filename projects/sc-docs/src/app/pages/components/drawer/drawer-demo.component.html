<app-story-host [meta]="meta" [stories]="stories()" />

<!-- Story como `<ng-template>`: el botón abre el drawer (estado en el signal `open`).
     El motor pinta canvas/knobs/código. Los `data-testid` los miden los e2e (no quitar). -->

<ng-template #playground let-args>
  <sc-button label="Abrir drawer" data-testid="open-drawer" (clicked)="open.set(true)" />

  <sc-drawer
    [header]="args.header || null"
    [position]="args.position"
    [modal]="args.modal"
    [dismissible]="args.dismissible"
    [closeOnEscape]="args.closeOnEscape"
    [showCloseIcon]="args.showCloseIcon"
    [fullScreen]="args.fullScreen"
    [width]="args.width || null"
    [topOffset]="args.topOffset || null"
    [docked]="args.docked"
    [visible]="open()"
    (visibleChange)="open.set($event)"
    data-testid="sc-drawer"
  >
    Contenido del drawer.
  </sc-drawer>
</ng-template>

<ng-template #docked>
  <sc-button label="Abrir panel acoplado" data-testid="open-drawer-docked" (clicked)="openDocked.set(true)" />

  <sc-drawer
    header="Detalle"
    position="right"
    width="var(--sc-spacing-25)"
    topOffset="var(--sc-spacing-4)"
    docked
    [modal]="false"
    [visible]="openDocked()"
    (visibleChange)="openDocked.set($event)"
    data-testid="sc-drawer-docked"
  >
    Un panel de la página: sin sombra ni velo, con el borde en su filo interior y la esquina de arriba redondeada.
  </sc-drawer>
</ng-template>
