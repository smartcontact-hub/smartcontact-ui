<app-cabecera
  arte="patrones"
  [titulo]="'fundamentos.patterns.title' | translate"
  [entradilla]="'fundamentos.patterns.lead' | translate"
/>

<!-- Una tarjeta por patrón, con su título y nada más: la regla, lo que se evita y con qué se resuelve están en su
     página. Antes los once iban seguidos aquí, unas 1.500 palabras de una tirada. -->
<ul class="pt">
  @for (p of patrones; track p.clave) {
    <li>
      <a class="pt__card" [routerLink]="'/fundamentos/patrones/' + p.ruta">
        <span class="pt__icon" aria-hidden="true"><sc-icon [name]="p.icono" [size]="20" /></span>
        <span class="pt__title sc-text-body-semibold">{{ 'fundamentos.patterns.principles.' + p.clave + '.title' | translate }}</span>
        <sc-icon class="pt__arrow" name="arrow_forward" [size]="16" aria-hidden="true" />
      </a>
    </li>
  }
</ul>

<p class="foot sc-text-caption-regular" [innerHTML]="'fundamentos.patterns.foot' | translate"></p>
